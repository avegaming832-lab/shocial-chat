<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SHOCIAL CHAT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;height:100vh;overflow:hidden}
button,input{font:inherit}button{cursor:pointer}
#loginScreen{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#312e81)}
.loginBox{width:370px;max-width:92%;padding:35px;text-align:center;border-radius:22px;background:#ffffff12;border:1px solid #ffffff22;backdrop-filter:blur(15px)}
.logo{font-size:34px;font-weight:bold;margin-bottom:10px}.subtitle{color:#cbd5e1;margin-bottom:28px}
#googleLogin{width:100%;padding:14px;border:0;border-radius:12px;background:#fff;color:#111827;font-weight:bold}
#app{display:none;height:100vh}.sidebar{width:340px;height:100vh;float:left;background:#111827;border-right:1px solid #263244;padding:16px}
.appTitle{font-size:25px;font-weight:bold;margin-bottom:15px}
.profile{background:#1e293b;padding:14px;border-radius:16px;margin-bottom:12px}
.profileTop{display:flex;align-items:center;gap:11px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#4f46e5}
.profileName{font-weight:bold}.profileEmail{font-size:11px;color:#94a3b8;margin-top:3px;word-break:break-all}.username{color:#818cf8;font-size:13px;margin-top:3px}
.profileButtons{display:flex;gap:7px;margin-top:11px}.profileButtons button{border:0;padding:8px 10px;border-radius:8px;color:#fff}
#editProfile{background:#4f46e5}#logout{background:#ef4444}
.searchBox{margin-bottom:10px}#searchInput{width:100%;padding:11px;border:0;outline:none;border-radius:10px;background:#1e293b;color:#fff}
.tabs{display:flex;gap:7px;margin-bottom:10px}.tab{flex:1;border:0;padding:9px;border-radius:9px;background:#1e293b;color:#cbd5e1}.tab.active{background:#4f46e5;color:#fff}
#usersList{height:calc(100vh - 320px);overflow-y:auto}.user{display:flex;align-items:center;gap:9px;padding:10px;margin-bottom:7px;border-radius:11px;background:#1e293b}.user:hover{background:#334155}.user img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#4f46e5}
.userInfo{flex:1;min-width:0}.userName{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userEmail{font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:11px;margin-top:3px}.online{color:#22c55e}.offline{color:#64748b}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}.online .dot{background:#22c55e}.offline .dot{background:#64748b}
.smallBtn{border:0;padding:7px 9px;border-radius:8px;background:#4f46e5;color:#fff;font-size:12px}.accept{background:#16a34a}.danger{background:#ef4444}
.emptySmall{text-align:center;color:#64748b;padding:20px;font-size:14px}
.chat{margin-left:340px;height:100vh;display:flex;flex-direction:column}.chatHeader{min-height:70px;padding:12px 20px;display:flex;align-items:center;gap:11px;background:#111827;border-bottom:1px solid #263244}
#chatAvatar{display:none;width:42px;height:42px;border-radius:50%;object-fit:cover}.chatTitle{font-weight:bold}.chatStatus,.typing{font-size:12px;margin-top:3px;color:#94a3b8}.typing{color:#818cf8}
#chatMessages{flex:1;overflow-y:auto;padding:20px}.empty{height:100%;display:flex;align-items:center;justify-content:center;color:#64748b;text-align:center}
.message{max-width:72%;padding:9px 12px;border-radius:15px;margin-bottom:10px;clear:both;word-break:break-word;position:relative}.mine{float:right;background:#4f46e5}.theirs{float:left;background:#334155}
.msgMeta{font-size:10px;opacity:.65;margin-top:4px;text-align:right}.msgActions{display:flex;gap:4px;margin-top:4px}.msgActions button{border:0;background:#ffffff18;color:#fff;border-radius:7px;font-size:11px;padding:3px 5px}
.inputArea{display:flex;gap:9px;padding:13px;background:#111827;border-top:1px solid #263244}#messageInput{flex:1;padding:13px;border:0;outline:none;border-radius:12px;background:#1e293b;color:#fff}#sendBtn{padding:13px 20px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:#000b;justify-content:center;align-items:center;z-index:20}.modalBox{width:360px;max-width:92%;background:#1e293b;padding:23px;border-radius:18px}.modalBox h2{margin-bottom:14px}.modalBox input{width:100%;padding:12px;border:0;outline:none;border-radius:10px;background:#0f172a;color:#fff;margin-bottom:12px}.modalActions{display:flex;gap:8px}.modalActions button{flex:1;padding:10px;border:0;border-radius:9px;color:#fff;background:#4f46e5}
#themeBtn{background:#475569}
.toast{position:fixed;right:18px;bottom:18px;background:#1e293b;border:1px solid #475569;padding:12px 15px;border-radius:12px;display:none;z-index:50}
@media(max-width:700px){
.sidebar{width:100%;height:315px;float:none;padding:10px}.appTitle{font-size:21px;margin-bottom:7px}.profile{padding:9px;margin-bottom:7px}.profileButtons{margin-top:7px}.searchBox{margin-bottom:7px}#usersList{height:82px;display:flex;gap:6px;overflow-x:auto}.user{min-width:220px;height:65px;margin:0}.chat{margin-left:0;height:calc(100vh - 315px)}.message{max-width:86%}.chatHeader{min-height:62px;padding:9px 12px}.inputArea{padding:9px}#sendBtn{padding:11px 15px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="loginBox">
    <div class="logo">SHOCIAL CHAT</div>
    <div class="subtitle">Connect • Chat • Stay Social</div>
    <button id="googleLogin">🔵 Continue with Google</button>
  </div>
</div>

<div id="app">
<aside class="sidebar">
  <div class="appTitle">SHOCIAL</div>
  <div class="profile">
    <div class="profileTop">
      <img id="myPhoto" class="avatar" alt="">
      <div>
        <div id="myName" class="profileName">User</div>
        <div id="myUsername" class="username">@username</div>
        <div id="myEmail" class="profileEmail">email</div>
      </div>
    </div>
    <div class="profileButtons">
      <button id="editProfile">Edit</button>
      <button id="themeBtn">Theme</button>
      <button id="logout">Logout</button>
    </div>
  </div>
  <div class="searchBox"><input id="searchInput" placeholder="Search people..."></div>
  <div class="tabs"><button id="peopleTab" class="tab active">People</button><button id="requestsTab" class="tab">Requests</button></div>
  <div id="usersList"></div>
</aside>

<main class="chat">
  <div class="chatHeader">
    <img id="chatAvatar" alt="">
    <div>
      <div id="chatHeader" class="chatTitle">Select someone to chat</div>
      <div id="chatStatus" class="chatStatus"></div>
      <div id="typingIndicator" class="typing"></div>
    </div>
  </div>
  <div id="chatMessages"><div class="empty">Select a friend to start chatting 💬</div></div>
  <div class="inputArea">
    <input id="messageInput" placeholder="Type a message..." autocomplete="off">
    <button id="sendBtn">Send</button>
  </div>
</main>
</div>

<div id="profileModal" class="modal">
 <div class="modalBox">
  <h2>Edit Profile</h2>
  <input id="usernameInput" maxlength="20" placeholder="Username">
  <div class="modalActions"><button id="saveUsername">Save</button><button id="closeModal" style="background:#475569">Cancel</button></div>
 </div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,updateDoc,collection,addDoc,query,where,orderBy,onSnapshot,serverTimestamp,getDocs,deleteDoc} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";
import {getDatabase,ref,set,onValue,onDisconnect,serverTimestamp as rtdbServerTimestamp} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyDejlZ2MNrf5C0L6UptLQN_TvShnTI84FE",
 authDomain:"social-chat-3326f.firebaseapp.com",
 projectId:"social-chat-3326f",
 storageBucket:"social-chat-3326f.firebasestorage.app",
 messagingSenderId:"1018414118260",
 appId:"1:1018414118260:web:2f28dcfd2beb2c62e9a821",
 measurementId:"G-CWCYBF3JCC"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),rtdb=getDatabase(app),provider=new GoogleAuthProvider();

let currentUser=null,currentProfile=null,selectedUser=null,currentTab="people";
let stopMessages=null,stopTyping=null,stopStatus=null,stopPeople=null,typingTimer=null,firstMessageSnapshot=true;
let lastTheme=localStorage.getItem("shocial-theme")||"dark";

const $=id=>document.getElementById(id);
const loginScreen=$("loginScreen"),appScreen=$("app");

function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}
function chatId(a,b){return [a,b].sort().join("_")}
function username(name){let x=(name||"user").toLowerCase().replace(/[^a-z0-9]/g,"");return (x||"user")+Math.floor(Math.random()*9999)}
function time(ts){if(!ts)return "";try{return ts.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}catch{return ""}}
function applyTheme(){document.body.style.filter=lastTheme==="light"?"invert(.9) hue-rotate(180deg)":"none"}
applyTheme();

$("googleLogin").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){toast(e.message);console.error(e)}};
$("themeBtn").onclick=()=>{lastTheme=lastTheme==="dark"?"light":"dark";localStorage.setItem("shocial-theme",lastTheme);applyTheme()};
$("logout").onclick=async()=>{if(currentUser)await set(ref(rtdb,"status/"+currentUser.uid),{state:"offline",lastChanged:rtdbServerTimestamp()});await signOut(auth)};

onAuthStateChanged(auth,async user=>{
 if(!user){currentUser=null;loginScreen.style.display="flex";appScreen.style.display="none";return}
 currentUser=user;loginScreen.style.display="none";appScreen.style.display="block";
 await saveUser();await loadProfile();setupPresence();loadPeople();enableNotifications();
});

async function saveUser(){
 const r=doc(db,"users",currentUser.uid),s=await getDoc(r);
 if(!s.exists())await setDoc(r,{uid:currentUser.uid,name:currentUser.displayName||"User",username:username(currentUser.displayName),email:currentUser.email||"",photo:currentUser.photoURL||"",friends:[],createdAt:serverTimestamp()});
}
async function loadProfile(){
 const s=await getDoc(doc(db,"users",currentUser.uid));if(!s.exists())return;
 currentProfile=s.data();$("myName").textContent=currentProfile.name||"User";$("myUsername").textContent="@"+(currentProfile.username||"user");$("myEmail").textContent=currentProfile.email||"";$("myPhoto").src=currentProfile.photo||currentUser.photoURL||"";$("usernameInput").value=currentProfile.username||"";
}
function setupPresence(){
 const mine=ref(rtdb,"status/"+currentUser.uid),connected=ref(rtdb,".info/connected");
 onValue(connected,s=>{if(s.val()!==true)return;onDisconnect(mine).set({state:"offline",lastChanged:rtdbServerTimestamp()});set(mine,{state:"online",lastChanged:rtdbServerTimestamp()})});
}
function watchStatus(uid,cb){return onValue(ref(rtdb,"status/"+uid),s=>cb(s.val()?.state==="online"))}

function loadPeople(){
 if(stopPeople)stopPeople();
 stopPeople=onSnapshot(collection(db,"users"),snap=>{if(currentTab==="people")renderPeople(snap)});
}
function renderPeople(snap){
 $("usersList").innerHTML="";const term=$("searchInput").value.trim().toLowerCase();let count=0;
 snap.forEach(ds=>{
  const u=ds.data();if(u.uid===currentUser.uid)return;
  const hay=((u.name||"")+" "+(u.username||"")+" "+(u.email||"")).toLowerCase();if(term&&!hay.includes(term))return;count++;
  const div=document.createElement("div");div.className="user";
  const img=document.createElement("img");img.src=u.photo||"";
  const info=document.createElement("div");info.className="userInfo";
  const n=document.createElement("div");n.className="userName";n.textContent=u.name||"User";
  const un=document.createElement("div");un.className="userEmail";un.textContent="@"+(u.username||"user");
  const st=document.createElement("div");st.className="status offline";st.innerHTML='<span class="dot"></span>Offline';
  watchStatus(u.uid,on=>{st.className="status "+(on?"online":"offline");st.innerHTML='<span class="dot"></span>'+(on?"Online":"Offline")});
  info.append(n,un,st);div.append(img,info);
  if((currentProfile?.friends||[]).includes(u.uid)){div.onclick=()=>openChat(u)}
  else{const b=document.createElement("button");b.className="smallBtn";b.textContent="Add";b.onclick=async e=>{e.stopPropagation();await sendRequest(u)};div.appendChild(b)}
  $("usersList").appendChild(div);
 });
 if(!count)$("usersList").innerHTML='<div class="emptySmall">No users found</div>';
}
async function sendRequest(u){
 const id=currentUser.uid+"_"+u.uid,r=doc(db,"friendRequests",id),s=await getDoc(r);
 if(s.exists()){toast("Request already sent");return}
 await setDoc(r,{fromUid:currentUser.uid,fromName:currentProfile.name||"User",fromUsername:currentProfile.username||"user",fromPhoto:currentProfile.photo||"",toUid:u.uid,status:"pending",createdAt:serverTimestamp()});
 toast("Friend request sent ✅");
}

$("requestsTab").onclick=()=>{currentTab="requests";$("peopleTab").classList.remove("active");$("requestsTab").classList.add("active");loadRequests()};
$("peopleTab").onclick=()=>{currentTab="people";$("requestsTab").classList.remove("active");$("peopleTab").classList.add("active");loadPeople()};
async function loadRequests(){
 $("usersList").innerHTML='<div class="emptySmall">Loading...</div>';
 const q=query(collection(db,"friendRequests"),where("toUid","==",currentUser.uid),where("status","==","pending"));
 onSnapshot(q,snap=>{
  $("usersList").innerHTML="";
  if(snap.empty){$("usersList").innerHTML='<div class="emptySmall">No friend requests</div>';return}
  snap.forEach(ds=>{const r=ds.data(),d=document.createElement("div");d.className="user";const img=document.createElement("img");img.src=r.fromPhoto||"";const i=document.createElement("div");i.className="userInfo";const n=document.createElement("div");n.className="userName";n.textContent=r.fromName;const un=document.createElement("div");un.className="userEmail";un.textContent="@"+r.fromUsername;i.append(n,un);const b=document.createElement("button");b.className="smallBtn accept";b.textContent="Accept";b.onclick=()=>acceptRequest(ds.id,r);d.append(img,i,b);$("usersList").appendChild(d)});
 });
}
async function acceptRequest(id,r){
 const me=doc(db,"users",currentUser.uid),other=doc(db,"users",r.fromUid),a=(await getDoc(me)).data(),b=(await getDoc(other)).data();
 const af=a.friends||[],bf=b.friends||[];if(!af.includes(r.fromUid))af.push(r.fromUid);if(!bf.includes(currentUser.uid))bf.push(currentUser.uid);
 await updateDoc(me,{friends:af});await updateDoc(other,{friends:bf});await updateDoc(doc(db,"friendRequests",id),{status:"accepted"});currentProfile.friends=af;toast("Friend added ✅");$("peopleTab").click();
}
$("searchInput").oninput=()=>{if(currentTab==="people")loadPeople()};

function openChat(u){
 selectedUser=u;firstMessageSnapshot=true;$("chatHeader").textContent=u.name||"User";$("chatAvatar").src=u.photo||"";$("chatAvatar").style.display="block";$("typingIndicator").textContent="";$("chatMessages").innerHTML='<div class="empty">Loading messages...</div>';
 if(stopMessages)stopMessages();if(stopTyping)stopTyping();if(stopStatus)stopStatus();
 stopStatus=watchStatus(u.uid,on=>$("chatStatus").innerHTML='<span class="dot '+(on?"online":"offline")+'"></span>'+(on?"Online":"Offline"));
 const cid=chatId(currentUser.uid,u.uid);
 stopTyping=onValue(ref(rtdb,"typing/"+cid+"/"+u.uid),s=>$("typingIndicator").textContent=s.val()===true?u.name+" is typing...":"");
 const q=query(collection(db,"chats",cid,"messages"),orderBy("createdAt"));
 stopMessages=onSnapshot(q,snap=>{
  $("chatMessages").innerHTML="";
  if(snap.empty){$("chatMessages").innerHTML='<div class="empty">Start the conversation 💬</div>';firstMessageSnapshot=false;return}
  snap.forEach(ds=>renderMessage(ds.id,ds.data()));
  if(firstMessageSnapshot){firstMessageSnapshot=false}else{snap.docChanges().forEach(c=>{if(c.type==="added"){const m=c.doc.data();if(m.senderId!==currentUser.uid&&document.hidden&&Notification.permission==="granted")new Notification(m.senderName||"New message",{body:m.text||""})}})}
  snap.docChanges().forEach(async c=>{if(c.type==="added"||c.type==="modified"){const m=c.doc.data();if(m.senderId!==currentUser.uid&&m.seen!==true)try{await updateDoc(doc(db,"chats",cid,"messages",c.doc.id),{delivered:true,seen:true})}catch{}}});
  $("chatMessages").scrollTop=$("chatMessages").scrollHeight;
 });
}
function renderMessage(id,m){
 const div=document.createElement("div");div.className="message "+(m.senderId===currentUser.uid?"mine":"theirs");
 const text=document.createElement("div");text.textContent=m.text||"";
 const meta=document.createElement("div");meta.className="msgMeta";meta.textContent=time(m.createdAt)+(m.senderId===currentUser.uid?"  "+(m.seen?"✓✓ Seen":m.delivered?"✓✓ Delivered":"✓ Sent"):"");
 div.append(text,meta);
 if(m.senderId===currentUser.uid){
  const actions=document.createElement("div");actions.className="msgActions";
  const del=document.createElement("button");del.textContent="Delete";del.onclick=async()=>{if(confirm("Delete this message?"))await deleteDoc(doc(db,"chats",chatId(currentUser.uid,selectedUser.uid),"messages",id))};
  const react=document.createElement("button");react.textContent=m.reaction||"❤️";react.onclick=async()=>{await updateDoc(doc(db,"chats",chatId(currentUser.uid,selectedUser.uid),"messages",id),{reaction:m.reaction?"":"❤️"})};
  actions.append(react,del);div.append(actions);
 }else if(m.reaction){const r=document.createElement("div");r.className="msgMeta";r.textContent=m.reaction;div.append(r)}
 $("chatMessages").appendChild(div);
}
$("messageInput").oninput=()=>{
 if(!selectedUser)return;const r=ref(rtdb,"typing/"+chatId(currentUser.uid,selectedUser.uid)+"/"+currentUser.uid);set(r,$("messageInput").value.length>0);clearTimeout(typingTimer);typingTimer=setTimeout(()=>set(r,false),1500);
};
async function sendMessage(){
 const input=$("messageInput"),text=input.value.trim();if(!text)return;if(!selectedUser){toast("Pehle friend select karo");return}
 const cid=chatId(currentUser.uid,selectedUser.uid);
 await addDoc(collection(db,"chats",cid,"messages"),{text,senderId:currentUser.uid,senderName:currentProfile.name||"User",delivered:false,seen:false,reaction:"",createdAt:serverTimestamp()});
 input.value="";await set(ref(rtdb,"typing/"+cid+"/"+currentUser.uid),false);
}
$("sendBtn").onclick=sendMessage;$("messageInput").onkeydown=e=>{if(e.key==="Enter")sendMessage()};

$("editProfile").onclick=()=>{$("usernameInput").value=currentProfile?.username||"";$("profileModal").style.display="flex"};
$("closeModal").onclick=()=>$("profileModal").style.display="none";
$("saveUsername").onclick=async()=>{
 let u=$("usernameInput").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");if(u.length<3){toast("Username 3+ characters ka ho");return}
 await updateDoc(doc(db,"users",currentUser.uid),{username:u});currentProfile.username=u;$("myUsername").textContent="@"+u;$("profileModal").style.display="none";toast("Username saved ✅");
};
async function enableNotifications(){if("Notification"in window&&Notification.permission==="default")try{await Notification.requestPermission()}catch{}}
</script>
</body>
</html>
