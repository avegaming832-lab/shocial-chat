
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOCIAL CHAT</title>
<style>
:root{--bg:#f0f2f5;--panel:#fff;--text:#111b21;--muted:#667781;--green:#008069;--line:#e9edef;--mine:#d9fdd3;--other:#fff}
body.dark{--bg:#0b141a;--panel:#111b21;--text:#e9edef;--muted:#8696a0;--green:#00a884;--line:#26353d;--mine:#005c4b;--other:#202c33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.5;cursor:not-allowed}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{background:var(--panel);padding:35px 25px;border-radius:18px;width:100%;max-width:380px;text-align:center;box-shadow:0 5px 25px #0001}
.logo{font-size:30px;font-weight:bold;color:var(--green);margin-bottom:8px}
.google{background:var(--green);color:white;border-radius:10px;padding:13px 18px;width:100%;margin-top:15px;font-weight:bold}
#app{display:none;height:100dvh;max-width:1500px;margin:auto;background:var(--panel);overflow:hidden}
.sidebar{width:390px;max-width:40%;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:280px}
.top{height:62px;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);gap:8px}
.brand{font-size:21px;font-weight:bold;color:var(--green)}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#dce5e7;flex-shrink:0}
.smallbtn{background:transparent;color:var(--text);font-size:21px;padding:7px;border-radius:50%}
.smallbtn:hover{background:var(--line)}
.search{padding:9px 12px;background:var(--panel)}
.search input{width:100%;padding:11px 15px;border:0;border-radius:9px;background:var(--bg);color:var(--text);outline:none}
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line)}
.tab{flex:1;background:transparent;padding:14px 3px;color:var(--muted);font-size:13px;border-bottom:3px solid transparent}
.tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:bold}
#list{overflow-y:auto;flex:1}
.person{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.person:hover,.person.selected{background:var(--bg)}
.person .info{flex:1;min-width:0}
.person .name{font-weight:600;margin-bottom:6px}
.person .preview{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .time{font-size:11px;color:var(--muted)}
.person button{background:var(--green);color:white;border-radius:8px;padding:7px;font-size:12px}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
#welcome{margin:auto;text-align:center;color:var(--muted);padding:20px}
#welcome h2{font-weight:400;color:var(--text)}
#chat{display:none;flex:1;min-height:0;flex-direction:column}
#chathead{height:62px;background:var(--bg);display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
#chathead .info{flex:1;min-width:0}
#chathead .name{font-weight:bold}
#chathead .sub{font-size:12px;color:var(--muted);margin-top:4px}
#messages{flex:1;overflow-y:auto;padding:18px 5%;display:flex;flex-direction:column;gap:8px}
.msg{max-width:min(75%,520px);padding:9px 10px;border-radius:9px;background:var(--other);align-self:flex-start;overflow-wrap:anywhere;box-shadow:0 1px 1px #0001}
.msg.mine{align-self:flex-end;background:var(--mine)}
.msg img{max-width:100%;max-height:240px;border-radius:7px;display:block}
.msg .meta{text-align:right;font-size:10px;color:var(--muted);margin-top:5px}
#composer{display:flex;align-items:center;gap:7px;padding:9px;background:var(--bg)}
#messageInput{flex:1;min-width:0;border:0;outline:0;background:var(--panel);color:var(--text);padding:13px;border-radius:10px}
.send{background:var(--green);color:white;border-radius:10px;padding:12px 15px}
#back{display:none}
.notice{padding:20px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0008;z-index:10;display:none;align-items:center;justify-content:center;padding:15px}
.modalbox{width:100%;max-width:420px;max-height:90dvh;overflow:auto;background:var(--panel);padding:22px;border-radius:16px}
.modalbox h2{margin-top:0}
.modalbox input,.modalbox textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.action{padding:11px 14px;border-radius:9px;background:var(--green);color:white;margin:4px 3px 4px 0}
.secondary{background:var(--bg);color:var(--text);border:1px solid var(--line)}
#callbar{display:none;position:fixed;z-index:20;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);padding:15px;border-radius:14px;box-shadow:0 3px 25px #0004;text-align:center;width:min(92%,350px)}
.statusbubble{width:55px;height:55px;border-radius:50%;border:3px solid var(--green);padding:2px;object-fit:cover}
@media(max-width:650px){
 #app{height:100dvh;width:100%}
 .sidebar{width:100%;max-width:none;min-width:0;border:0}
 #main{display:none}
 #app.chatopen .sidebar{display:none}
 #app.chatopen #main{display:flex}
 #back{display:inline-block}
 #messages{padding:12px}
 .msg{max-width:88%}
 .brand{font-size:19px}
}
</style>
</head>
<body>
<div id="login">
 <div class="loginbox">
  <div class="logo">SHOCIAL CHAT</div>
  <p>Messages, friends and moments — all in one place.</p>
  <button class="google" id="loginBtn">Continue with Google</button>
  <p id="loginError" style="color:#d33;font-size:13px"></p>
 </div>
</div>

<div id="app">
 <aside class="sidebar">
  <div class="top">
   <div class="brand">SHOCIAL CHAT</div>
   <div style="display:flex;align-items:center;gap:2px">
    <button class="smallbtn" id="themeBtn" title="Dark/light mode">🌙</button>
    <button class="smallbtn" id="profileBtn" title="Profile and settings">⚙️</button>
    <button class="smallbtn" id="logoutBtn" title="Log out">⇥</button>
   </div>
  </div>
  <div class="search"><input id="searchInput" placeholder="Search chats and friends..."></div>
  <div class="tabs">
   <button class="tab active" data-tab="chats">💬 Chats</button>
   <button class="tab" data-tab="friends">👥 Friends</button>
   <button class="tab" data-tab="status">⭕ Status</button>
  </div>
  <div id="list"><div class="notice">Loading your chats...</div></div>
 </aside>

 <main id="main">
  <div id="welcome">
   <div style="font-size:65px">💬</div>
   <h2>Welcome to SHOCIAL CHAT</h2>
   <p>Select a friend to start chatting.</p>
   <p>🔒 Stay kind. Chat safely.</p>
  </div>
  <section id="chat">
   <div id="chathead">
    <button class="smallbtn" id="back">‹</button>
    <img class="avatar" id="chatPhoto" alt="">
    <div class="info"><div class="name" id="chatName">Friend</div><div class="sub" id="chatSub">SHOCIAL CHAT</div></div>
    <button class="smallbtn" id="voiceCall" title="Voice call">📞</button>
   </div>
   <div id="messages"></div>
   <div id="composer">
    <label class="smallbtn" title="Send image" for="imageInput">＋</label>
    <input type="file" id="imageInput" accept="image/*" hidden>
    <input id="messageInput" placeholder="Type a message..." autocomplete="off">
    <button class="smallbtn" id="recordBtn" title="Voice message">🎤</button>
    <button class="send" id="sendBtn">➤</button>
   </div>
  </section>
 </main>
</div>

<div class="modal" id="profileModal">
 <div class="modalbox">
  <h2>👤 Your profile</h2>
  <label>Display name</label><input id="editName" maxlength="40" placeholder="Your name">
  <label>Profile photo URL (optional)</label><input id="editPhoto" placeholder="https://...">
  <label>About / bio</label><textarea id="editBio" rows="3" maxlength="160" placeholder="Hey there! I am using SHOCIAL CHAT."></textarea>
  <button class="action" id="saveProfile">Save profile</button>
  <button class="action secondary" data-close="profileModal">Cancel</button>
  <p id="profileError" style="color:#d33"></p>
 </div>
</div>

<div class="modal" id="statusModal">
 <div class="modalbox">
  <h2>⭕ Add status</h2>
  <textarea id="statusText" rows="3" maxlength="250" placeholder="What's on your mind?"></textarea>
  <label>Or add a photo URL (optional)</label>
  <input id="statusPhoto" placeholder="https://...">
  <button class="action" id="postStatus">Post status</button>
  <button class="action secondary" data-close="statusModal">Cancel</button>
 </div>
</div>

<div class="modal" id="addFriendModal">
 <div class="modalbox">
  <h2>➕ Find friends</h2>
  <input id="friendSearch" placeholder="Search by name or email">
  <div id="friendResults"></div>
  <button class="action secondary" data-close="addFriendModal">Close</button>
 </div>
</div>

<div id="callbar">
 <div id="callText">Calling...</div>
 <div style="margin-top:10px">
  <button class="action" id="acceptCall" style="display:none">Accept</button>
  <button class="action" id="endCall" style="background:#d93025">End call</button>
 </div>
</div>
<audio id="remoteAudio" autoplay></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc,
 getDocs, query, where, onSnapshot, serverTimestamp, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Your existing Firebase project */
const firebaseConfig = {
 apiKey: "AIzaSyBTjA_RsNNq1PtfSdE2VyFJS_5oU8BsVNc",
 authDomain: "social-chat-d48ff.firebaseapp.com",
 projectId: "social-chat-d48ff",
 storageBucket: "social-chat-d48ff.firebasestorage.app",
 messagingSenderId: "198437830373",
 appId: "1:198437830373:web:61616f534f9ee7e3c19e0c",
 measurementId: "G-7XMGG8N96Z"
};

const appFirebase = initializeApp(firebaseConfig);
const auth = getAuth(appFirebase);
const db = getFirestore(appFirebase);
const $ = id => document.getElementById(id);

let me = null, myProfile = {}, selected = null, currentTab = "chats";
let people = [], requests = [], statuses = [], messagesUnsub = null;
let unsubscribers = [], currentMessages = [], mediaRecorder = null, recordedChunks = [];
let pc = null, localStream = null, activeCallId = null, incomingCallId = null;
let activeCallUnsub = null, callCandidateUnsubs = [], handledIncoming = new Set();
const defaultPhoto = "https://www.gravatar.com/avatar/?d=mp&s=100";
const photoFor = p => p?.photo || defaultPhoto;
const escapeHTML = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = t => {
 const d = t?.toDate ? t.toDate() : (t ? new Date(t) : null);
 return d && !isNaN(d) ? d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "";
};
const chatIdFor = (a,b) => [a,b].sort().join("_");
const openModal = id => $(id).style.display = "flex";
const closeModal = id => $(id).style.display = "none";

function setError(msg) { $("loginError").textContent = msg; }
function cleanListeners() {
 unsubscribers.forEach(fn=>fn()); unsubscribers=[];
 if(messagesUnsub) messagesUnsub();
 messagesUnsub=null;
}
function setTheme(dark) {
 document.body.classList.toggle("dark",dark);
 $("themeBtn").textContent=dark?"☀️":"🌙";
 localStorage.setItem("shocial-theme",dark?"dark":"light");
}
setTheme(localStorage.getItem("shocial-theme")==="dark");
$("themeBtn").onclick=()=>setTheme(!document.body.classList.contains("dark"));

$("loginBtn").onclick=async()=>{
 try {
  setError("");
  await signInWithPopup(auth,new GoogleAuthProvider());
 } catch(e) { setError(e.message || "Login failed. Please try again."); }
};
$("logoutBtn").onclick=()=>signOut(auth);
$("profileBtn").onclick=()=>{
 $("editName").value=myProfile.name||me?.displayName||"";
 $("editPhoto").value=myProfile.photo||me?.photoURL||"";
 $("editBio").value=myProfile.bio||"";
 $("profileError").textContent="";
 openModal("profileModal");
};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m)m.style.display="none"}));

onAuthStateChanged(auth,async user=>{
 cleanListeners();
 if(!user){
  me=null; selected=null;
  $("app").style.display="none"; $("login").style.display="flex";
  if(pc) endCurrentCall(false);
  return;
 }
 me=user;
 $("login").style.display="none"; $("app").style.display="flex";
 const ref=doc(db,"users",me.uid);
 const snap=await getDoc(ref);
 if(!snap.exists()){
  myProfile={uid:me.uid,name:me.displayName||"User",email:me.email||"",photo:me.photoURL||"",bio:"",statusText:"",statusPhoto:""};
  await setDoc(ref,{...myProfile,createdAt:serverTimestamp()});
 } else {
  myProfile={...snap.data(),uid:me.uid};
  if(!myProfile.name) myProfile.name=me.displayName||"User";
  if(!myProfile.photo) myProfile.photo=me.photoURL||"";
 }
 startListeners();
});

function startListeners(){
 unsubscribers.push(onSnapshot(collection(db,"users"),snap=>{
  people=snap.docs.map(d=>({uid:d.id,...d.data()}));
  myProfile=people.find(p=>p.uid===me.uid)||myProfile;
  if(selected) updateChatHeader();
  renderList();
  if(currentTab==="status") renderList();
 }));
 unsubscribers.push(onSnapshot(collection(db,"friendRequests"),snap=>{
  requests=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderList();
 }));
 unsubscribers.push(onSnapshot(collection(db,"calls"),snap=>{
  for(const d of snap.docs){
   const c={id:d.id,...d.data()};
   if(c.calleeId===me.uid && c.status==="ringing" && !handledIncoming.has(c.id)){
    handledIncoming.add(c.id);
    incomingCallId=c.id;
    $("callText").textContent=(c.callerName||"Someone")+" is calling...";
    $("acceptCall").style.display="inline-block";
    $("callbar").style.display="block";
   }
   if(c.id===activeCallId && c.status==="ended" && pc) endCurrentCall(false);
  }
 }));
}

function acceptedFriendIds(){
 const ids=new Set();
 for(const r of requests){
  if(r.status!=="accepted") continue;
  if(r.fromUid===me.uid) ids.add(r.toUid);
  if(r.toUid===me.uid) ids.add(r.fromUid);
 }
 (myProfile.friends||[]).forEach(id=>ids.add(id));
 ids.delete(me.uid);
 return ids;
}
function friendRequestTo(uid){
 return requests.find(r=>(r.fromUid===me.uid&&r.toUid===uid)||(r.toUid===me.uid&&r.fromUid===uid));
}
function renderList(){
 if(!me)return;
 const term=$("searchInput").value.trim().toLowerCase();
 const friendIds=acceptedFriendIds();
 let html="";
 if(currentTab==="chats"){
  let friends=people.filter(p=>friendIds.has(p.uid)&&p.uid!==me.uid);
  if(term) friends=friends.filter(p=>(p.name||"").toLowerCase().includes(term)||(p.email||"").toLowerCase().includes(term));
  html=`<div class="person" id="addFriendShortcut"><div class="avatar" style="display:grid;place-items:center;font-size:23px">➕</div><div class="info"><div class="name">Add friends</div><div class="preview">Find people to chat with</div></div></div>`;
  html+=friends.map(p=>{
   const isSel=selected?.uid===p.uid;
   return `<div class="person ${isSel?"selected":""}" data-user="${escapeHTML(p.uid)}">
    <img class="avatar" src="${escapeHTML(photoFor(p))}" onerror="this.src='${defaultPhoto}'">
    <div class="info"><div class="name">${escapeHTML(p.name||"User")}</div><div class="preview">${isSel?"Open conversation":"Tap to open chat"}</div></div>
   </div>`;
  }).join("");
  if(!friends.length) html+=`<div class="notice">No friends yet. Tap “Add friends” to get started.</div>`;
 } else if(currentTab==="friends"){
  const incoming=requests.filter(r=>r.toUid===me.uid&&r.status==="pending");
  const outgoing=requests.filter(r=>r.fromUid===me.uid&&r.status==="pending");
  const friends=people.filter(p=>friendIds.has(p.uid));
  html=`<div class="person" id="addFriendShortcut"><div class="avatar" style="display:grid;place-items:center;font-size:23px">➕</div><div class="info"><div class="name">Add friends</div><div class="preview">Search by name or email</div></div></div>`;
  html+=`<div class="notice">FRIEND REQUESTS (${incoming.length})</div>`;
  html+=incoming.map(r=>{const p=people.find(x=>x.uid===r.fromUid)||{name:"User"};return `<div class="person"><img class="avatar" src="${escapeHTML(photoFor(p))}"><div class="info"><div class="name">${escapeHTML(p.name)}</div><div class="preview">${escapeHTML(p.email||"Wants to be your friend")}</div></div><button data-accept="${r.id}">Accept</button></div>`}).join("");
  if(!incoming.length) html+=`<div class="notice">No new requests.</div>`;
  html+=`<div class="notice">SENT REQUESTS (${outgoing.length})</div>`;
  html+=outgoing.map(r=>{const p=people.find(x=>x.uid===r.toUid)||{name:"User"};return `<div class="person"><img class="avatar" src="${escapeHTML(photoFor(p))}"><div class="info"><div class="name">${escapeHTML(p.name)}</div><div class="preview">Request sent</div></div></div>`}).join("");
  html+=`<div class="notice">MY FRIENDS (${friends.length})</div>`;
  html+=friends.map(p=>`<div class="person" data-user="${escapeHTML(p.uid)}"><img class="avatar" src="${escapeHTML(photoFor(p))}"><div class="info"><div class="name">${escapeHTML(p.name||"User")}</div><div class="preview">${escapeHTML(p.bio||p.email||"Friend")}</div></div><button data-chat="${escapeHTML(p.uid)}">Chat</button></div>`).join("");
 } else {
  const visible=people.filter(p=>p.uid!==me.uid&&(p.statusText||p.statusPhoto)&&p.statusAt);
  visible.sort((a,b)=>(b.statusAt?.seconds||0)-(a.statusAt?.seconds||0));
  html=`<div class="person" id="addStatusShortcut"><div class="avatar" style="display:grid;place-items:center;font-size:23px">＋</div><div class="info"><div class="name">My status</div><div class="preview">Share a text or photo update</div></div></div>`;
  html+=visible.map(p=>`<div class="person" data-status="${escapeHTML(p.uid)}"><img class="statusbubble" src="${escapeHTML(p.statusPhoto||photoFor(p))}"><div class="info"><div class="name">${escapeHTML(p.name||"User")}</div><div class="preview">${escapeHTML(p.statusText||"📷 Photo status")}</div></div><div class="time">${fmtTime(p.statusAt)}</div></div>`).join("");
  if(!visible.length) html+=`<div class="notice">No status updates yet.</div>`;
 }
 $("list").innerHTML=html;
 $("addFriendShortcut")?.addEventListener("click",()=>{openModal("addFriendModal");searchUsers()});
 $("addStatusShortcut")?.addEventListener("click",()=>openModal("statusModal"));
 document.querySelectorAll("[data-user]").forEach(el=>el.addEventListener("click",()=>openChat(el.dataset.user)));
 document.querySelectorAll("[data-chat]").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();openChat(el.dataset.chat)}));
 document.querySelectorAll("[data-accept]").forEach(el=>el.addEventListener("click",()=>acceptRequest(el.dataset.accept)));
 document.querySelectorAll("[data-status]").forEach(el=>el.addEventListener("click",()=>viewStatus(el.dataset.status)));
}
document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{
 currentTab=btn.dataset.tab;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b===btn));
 renderList();
});
$("searchInput").addEventListener("input",renderList);
$("friendSearch").addEventListener("input",searchUsers);

async function acceptRequest(id){
 try{
  const r=requests.find(x=>x.id===id);
  if(!r)return;
  await updateDoc(doc(db,"friendRequests",id),{status:"accepted",acceptedAt:serverTimestamp()});
  alert("Friend request accepted!");
 }catch(e){alert("Could not accept request: "+e.message)}
}

async function searchUsers(){
 if(!me)return;
 const term=$("friendSearch").value.trim().toLowerCase();
 const friendIds=acceptedFriendIds();
 let results=people.filter(p=>p.uid!==me.uid&&!friendIds.has(p.uid)&&
  ((p.name||"").toLowerCase().includes(term)||(p.email||"").toLowerCase().includes(term)));
 if(!term) results=results.slice(0,20);
 $("friendResults").innerHTML=results.map(p=>{
  const req=friendRequestTo(p.uid);
  let button="";
  if(req?.status==="pending") button=req.fromUid===me.uid?`<button class="action secondary" disabled>Request sent</button>`:`<button class="action" data-accept="${req.id}">Accept request</button>`;
  else button=`<button class="action" data-add="${escapeHTML(p.uid)}">Add</button>`;
  return `<div class="person"><img class="avatar" src="${escapeHTML(photoFor(p))}"><div class="info"><div class="name">${escapeHTML(p.name||"User")}</div><div class="preview">${escapeHTML(p.email||"")}</div></div>${button}</div>`;
 }).join("")||`<div class="notice">No matching users found.</div>`;
 $("friendResults").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>sendRequest(b.dataset.add));
 $("friendResults").querySelectorAll("[data-accept]").forEach(b=>b.onclick=()=>acceptRequest(b.dataset.accept));
}
async function sendRequest(uid){
 try{
  if(friendRequestTo(uid)){alert("A request already exists.");return;}
  await addDoc(collection(db,"friendRequests"),{fromUid:me.uid,toUid:uid,status:"pending",createdAt:serverTimestamp()});
  alert("Friend request sent!");
  searchUsers();
 }catch(e){alert("Request failed: "+e.message)}
}

function updateChatHeader(){
 if(!selected)return;
 $("chatPhoto").src=photoFor(selected);
 $("chatName").textContent=selected.name||"User";
 $("chatSub").textContent=selected.bio||selected.email||"SHOCIAL CHAT";
}
async function openChat(uid){
 const p=people.find(x=>x.uid===uid);
 if(!p||p.uid===me.uid)return;
 selected=p;
 $("app").classList.add("chatopen");
 $("welcome").style.display="none"; $("chat").style.display="flex";
 updateChatHeader();
 if(messagesUnsub)messagesUnsub();
 $("messages").innerHTML=`<div class="notice">Loading messages...</div>`;
 const chatId=chatIdFor(me.uid,uid);
 const q=query(collection(db,"chats",chatId,"messages"),orderBy("createdAt","asc"),limit(150));
 messagesUnsub=onSnapshot(q,snap=>{
  currentMessages=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderMessages();
  snap.docs.forEach(d=>{
   const m=d.data();
   if(m.toUid===me.uid&&!(m.seenBy||[]).includes(me.uid)){
    updateDoc(doc(db,"chats",chatId,"messages",d.id),{seenBy:[...(m.seenBy||[]),me.uid]}).catch(()=>{});
   }
  });
 },err=>{$("messages").innerHTML=`<div class="notice">Could not load messages: ${escapeHTML(err.message)}</div>`});
 renderList();
}
$("back").onclick=()=>{
 $("app").classList.remove("chatopen");
 selected=null;
 $("chat").style.display="none";$("welcome").style.display="block";
 if(messagesUnsub)messagesUnsub();
 renderList();
};

function renderMessages(){
 const box=$("messages");
 box.innerHTML=currentMessages.map(m=>{
  const mine=m.fromUid===me.uid;
  let body="";
  if(m.type==="image") body=`<img src="${escapeHTML(m.text)}" alt="Image message">`;
  else if(m.type==="audio") body=`<audio controls src="${escapeHTML(m.text)}" style="max-width:230px"></audio>`;
  else body=`<div>${escapeHTML(m.text).replace(/\n/g,"<br>")}</div>`;
  const seen=(m.seenBy||[]).includes(selected?.uid);
  const ticks=mine?(seen?"<span style='color:#53bdeb'>✓✓</span>":"✓✓"):"";
  return `<div class="msg ${mine?"mine":""}">${body}<div class="meta">${fmtTime(m.createdAt)} ${ticks}</div></div>`;
 }).join("");
 box.scrollTop=box.scrollHeight;
}
async function sendMessage(text,type="text"){
 if(!selected||!text.trim())return;
 const chatId=chatIdFor(me.uid,selected.uid);
 $("messageInput").value="";
 try{
  await addDoc(collection(db,"chats",chatId,"messages"),{
   fromUid:me.uid,toUid:selected.uid,text,type,
   seenBy:[me.uid],createdAt:serverTimestamp()
  });
 }catch(e){alert("Message failed: "+e.message)}
}
$("sendBtn").onclick=()=>sendMessage($("messageInput").value);
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage($("messageInput").value)}});
$("imageInput").onchange=async e=>{
 const file=e.target.files?.[0];if(!file)return;
 if(file.size>500000){alert("Please choose an image under 500 KB.");e.target.value="";return;}
 const reader=new FileReader();
 reader.onload=()=>sendMessage(String(reader.result),"image");
 reader.readAsDataURL(file);
 e.target.value="";
};

$("saveProfile").onclick=async()=>{
 const name=$("editName").value.trim();
 if(!name){$("profileError").textContent="Please enter a display name.";return;}
 try{
  await updateDoc(doc(db,"users",me.uid),{
   name,photo:$("editPhoto").value.trim(),bio:$("editBio").value.trim()
  });
  myProfile={...myProfile,name,photo:$("editPhoto").value.trim(),bio:$("editBio").value.trim()};
  closeModal("profileModal");
 }catch(e){$("profileError").textContent=e.message}
};
$("postStatus").onclick=async()=>{
 const text=$("statusText").value.trim(),photo=$("statusPhoto").value.trim();
 if(!text&&!photo){alert("Write a status or add a photo URL.");return;}
 try{
  await updateDoc(doc(db,"users",me.uid),{statusText:text,statusPhoto:photo,statusAt:serverTimestamp()});
  $("statusText").value="";$("statusPhoto").value="";
  closeModal("statusModal");currentTab="status";
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab==="status"));
  renderList();
 }catch(e){alert("Status failed: "+e.message)}
};
function viewStatus(uid){
 const p=people.find(x=>x.uid===uid);if(!p)return;
 let msg=(p.name||"Friend")+"'s status\n\n"+(p.statusText||"");
 if(p.statusPhoto)msg+="\n\nPhoto: "+p.statusPhoto;
 alert(msg);
}

/* Voice messages */
$("recordBtn").onclick=async()=>{
 if(mediaRecorder?.state==="recording"){mediaRecorder.stop();$("recordBtn").textContent="🎤";return;}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recordedChunks=[];
  mediaRecorder=new MediaRecorder(stream);
  mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};
  mediaRecorder.onstop=()=>{
   const blob=new Blob(recordedChunks,{type:"audio/webm"});
   stream.getTracks().forEach(t=>t.stop());
   if(blob.size>500000){alert("Voice message is too large. Please record a shorter one.");return;}
   const reader=new FileReader();
   reader.onload=()=>sendMessage(String(reader.result),"audio");
   reader.readAsDataURL(blob);
  };
  mediaRecorder.start();$("recordBtn").textContent="⏹";
 }catch(e){alert("Microphone permission is needed: "+e.message)}
};

/* Basic WebRTC voice calls. Works best on HTTPS with microphone permission. */
function clearCallListeners(){callCandidateUnsubs.forEach(fn=>fn());callCandidateUnsubs=[];if(activeCallUnsub)activeCallUnsub();activeCallUnsub=null;}
function watchCandidates(callId,collectionName){
 const unsub=onSnapshot(collection(db,"calls",callId,collectionName),snap=>{
  snap.docChanges().forEach(async change=>{
   if(change.type!=="added"||!pc)return;
   try{await pc.addIceCandidate(new RTCIceCandidate(change.doc.data()))}catch(e){}
  });
 });
 callCandidateUnsubs.push(unsub);
}
async function preparePeer(callId,collectionName){
 pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
 pc.ontrack=e=>{$("remoteAudio").srcObject=e.streams[0]};
 pc.onicecandidate=e=>{
  if(e.candidate)addDoc(collection(db,"calls",callId,collectionName),e.candidate.toJSON()).catch(()=>{});
 };
 localStream=await navigator.mediaDevices.getUserMedia({audio:true});
 localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
}
$("voiceCall").onclick=async()=>{
 if(!selected)return;
 try{
  const friend=selected;
  const callRef=doc(collection(db,"calls"));
  activeCallId=callRef.id;
  await preparePeer(activeCallId,"callerCandidates");
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  await setDoc(callRef,{callerId:me.uid,callerName:myProfile.name||me.displayName||"Friend",calleeId:friend.uid,status:"ringing",offer:{type:offer.type,sdp:offer.sdp},createdAt:serverTimestamp()});
  $("callText").textContent="Calling "+(friend.name||"friend")+"...";
  $("acceptCall").style.display="none";$("callbar").style.display="block";
  watchCandidates(activeCallId,"calleeCandidates");
  activeCallUnsub=onSnapshot(callRef,async snap=>{
   const c=snap.data();
   if(c?.answer&&pc?.signalingState==="have-local-offer"){
    try{await pc.setRemoteDescription(new RTCSessionDescription(c.answer))}catch(e){}
   }
   if(c?.status==="ended"&&pc)endCurrentCall(false);
  });
 }catch(e){alert("Could not start call: "+e.message);endCurrentCall(false)}
};
$("acceptCall").onclick=async()=>{
 const id=incomingCallId;if(!id)return;
 try{
  const ref=doc(db,"calls",id),snap=await getDoc(ref),c=snap.data();
  if(!c?.offer)throw new Error("Call offer is missing.");
  activeCallId=id;
  await preparePeer(id,"calleeCandidates");
  await pc.setRemoteDescription(new RTCSessionDescription(c.offer));
  watchCandidates(id,"callerCandidates");
  const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
  await updateDoc(ref,{answer:{type:answer.type,sdp:answer.sdp},status:"connected"});
  $("callText").textContent="Voice call connected";
  $("acceptCall").style.display="none";$("callbar").style.display="block";
  activeCallUnsub=onSnapshot(ref,s=>{if(s.data()?.status==="ended"&&pc)endCurrentCall(false)});
 }catch(e){alert("Could not answer call: "+e.message);endCurrentCall(false)}
};
$("endCall").onclick=()=>endCurrentCall(true);
async function endCurrentCall(updateRemote=true){
 const id=activeCallId||incomingCallId;
 if(updateRemote&&id)updateDoc(doc(db,"calls",id),{status:"ended"}).catch(()=>{});
 clearCallListeners();
 if(pc){pc.close();pc=null}
 if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null}
 $("remoteAudio").srcObject=null;
 $("callbar").style.display="none";$("acceptCall").style.display="none";
 activeCallId=null;incomingCallId=null;
}
</script>
