<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SHOCIAL CHAT</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0b0f;
    color:white;
}
button,input{font:inherit}
#loginScreen{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#111,#292929);
}
.loginBox{
    width:360px;
    max-width:90%;
    padding:35px;
    border-radius:22px;
    background:#17171d;
    text-align:center;
    box-shadow:0 20px 60px #000;
}
.loginBox h1{margin-top:0}
.googleBtn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    cursor:pointer;
    background:white;
    color:#111;
    font-weight:bold;
}
#app{
    display:none;
    height:100vh;
}
.sidebar{
    width:300px;
    background:#15151b;
    border-right:1px solid #292930;
    padding:15px;
    display:flex;
    flex-direction:column;
}
.profile{
    padding:10px;
    border-radius:15px;
    background:#202027;
    margin-bottom:12px;
}
.avatar{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
}
.profileRow{
    display:flex;
    align-items:center;
    gap:10px;
}
.search{
    width:100%;
    padding:12px;
    border:0;
    outline:none;
    border-radius:12px;
    background:#24242c;
    color:white;
    margin-bottom:10px;
}
.people{
    overflow:auto;
}
.person{
    padding:12px;
    border-radius:12px;
    cursor:pointer;
    display:flex;
    gap:10px;
    align-items:center;
}
.person:hover{background:#25252d}
.chatArea{
    flex:1;
    display:flex;
    flex-direction:column;
}
.chatHeader{
    height:70px;
    padding:10px 15px;
    border-bottom:1px solid #292930;
    display:flex;
    align-items:center;
    justify-content:space-between;
}
.chatUser{
    display:flex;
    align-items:center;
    gap:10px;
}
.callButtons{
    display:flex;
    gap:8px;
}
.callBtn{
    border:0;
    border-radius:12px;
    padding:10px 14px;
    cursor:pointer;
    background:#25252d;
    color:white;
}
.callBtn:hover{background:#34343d}
.messages{
    flex:1;
    overflow:auto;
    padding:20px;
}
.message{
    margin:8px 0;
    display:flex;
}
.message.mine{justify-content:flex-end}
.bubble{
    max-width:70%;
    padding:10px 13px;
    border-radius:16px;
    background:#25252d;
    word-break:break-word;
}
.mine .bubble{
    background:#315cff;
}
.time{
    font-size:10px;
    opacity:.6;
    margin-top:4px;
}
.composer{
    padding:12px;
    display:flex;
    gap:8px;
    border-top:1px solid #292930;
}
.composer input{
    flex:1;
    border:0;
    outline:none;
    border-radius:13px;
    padding:13px;
    background:#24242c;
    color:white;
}
.sendBtn,.mediaBtn,.voiceBtn{
    border:0;
    border-radius:13px;
    padding:0 15px;
    cursor:pointer;
    background:#315cff;
    color:white;
}
.mediaBtn,.voiceBtn{
    background:#25252d;
}
.logout{
    margin-top:auto;
    padding:12px;
    border:0;
    border-radius:12px;
    background:#292930;
    color:white;
    cursor:pointer;
}

/* CALL SCREEN */
#callScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(5,5,8,.97);
    align-items:center;
    justify-content:center;
}
.callBox{
    width:360px;
    max-width:90%;
    text-align:center;
    padding:35px;
    border-radius:25px;
    background:#18181f;
    box-shadow:0 20px 80px #000;
}
.callAvatar{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:15px;
}
.callName{
    font-size:24px;
    font-weight:bold;
}
.callStatus{
    opacity:.7;
    margin:10px 0 25px;
}
.callActions{
    display:flex;
    justify-content:center;
    gap:15px;
}
.accept{
    background:#18a957;
    border:0;
    color:white;
    width:60px;
    height:60px;
    border-radius:50%;
    cursor:pointer;
    font-size:22px;
}
.reject,.hangup{
    background:#e53935;
    border:0;
    color:white;
    width:60px;
    height:60px;
    border-radius:50%;
    cursor:pointer;
    font-size:22px;
}
.mute{
    background:#444;
    border:0;
    color:white;
    width:60px;
    height:60px;
    border-radius:50%;
    cursor:pointer;
    font-size:22px;
}


/* PROFILE SETTINGS */
.settingsBtn{
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:12px;
    background:#292930;
    color:white;
    cursor:pointer;
}
.settingsBtn:hover{background:#34343d}
#settingsModal{
    display:none;
    position:fixed;
    inset:0;
    z-index:10000;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    padding:20px;
}
.settingsBox{
    width:390px;
    max-width:100%;
    background:#18181f;
    border-radius:22px;
    padding:25px;
    box-shadow:0 20px 80px #000;
}
.settingsBox h2{margin-top:0}
.settingsAvatar{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:0 auto 12px;
}
.settingsInput{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:0;
    outline:none;
    border-radius:12px;
    background:#24242c;
    color:white;
}
.themeRow{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:10px 0 15px;
}
.themeBtn{
    border:0;
    border-radius:10px;
    padding:10px 12px;
    color:white;
    cursor:pointer;
    background:#292930;
}
.themeBtn.active{outline:2px solid white}
.saveSettings{
    width:100%;
    padding:12px;
    border:0;
    border-radius:12px;
    background:#315cff;
    color:white;
    cursor:pointer;
    font-weight:bold;
}
.closeSettings{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:0;
    border-radius:12px;
    background:#292930;
    color:white;
    cursor:pointer;
}

/* THEMES */
body.theme-blue .sendBtn,
body.theme-blue .saveSettings,
body.theme-blue .mine .bubble{background:#315cff}
body.theme-purple .sendBtn,
body.theme-purple .saveSettings,
body.theme-purple .mine .bubble{background:#8b5cf6}
body.theme-green .sendBtn,
body.theme-green .saveSettings,
body.theme-green .mine .bubble{background:#16a34a}
body.theme-purple .callBtn:hover,
body.theme-purple .person:hover{background:#34265a}
body.theme-green .callBtn:hover,
body.theme-green .person:hover{background:#183b28}


/* FRIENDS + BOTTOM NAV */
#friendsScreen{
    display:none;
    position:fixed;
    inset:0;
    z-index:8000;
    background:#0b0b0f;
    padding:22px;
    overflow:auto;
}
.friendsPanel{
    max-width:850px;
    margin:0 auto;
    background:#15151b;
    border:1px solid #292930;
    border-radius:20px;
    padding:20px;
    min-height:calc(100vh - 44px);
}
.friendsTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:15px;
}
.friendsTop h2{margin:0}
.friendsClose{
    border:0;
    border-radius:12px;
    padding:10px 14px;
    background:#292930;
    color:white;
    cursor:pointer;
}
.friendTabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
    flex-wrap:wrap;
}
.friendTab{
    border:0;
    border-radius:12px;
    padding:10px 14px;
    background:#24242c;
    color:white;
    cursor:pointer;
}
.friendTab.active{background:#315cff}
.friendSearch{
    width:100%;
    padding:12px;
    border:0;
    outline:none;
    border-radius:12px;
    background:#24242c;
    color:white;
    margin-bottom:12px;
}
.friendList{
    display:grid;
    gap:8px;
}
.friendCard{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border-radius:14px;
    background:#202027;
}
.friendCardInfo{flex:1;min-width:0}
.friendCardInfo b{display:block}
.friendCardInfo div{
    font-size:11px;
    opacity:.55;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.friendAction{
    border:0;
    border-radius:10px;
    padding:9px 12px;
    background:#315cff;
    color:white;
    cursor:pointer;
}
.friendAction.gray{background:#292930}
.friendAction.green{background:#18a957}
.emptyFriends{
    padding:30px;
    text-align:center;
    opacity:.6;
}
.bottomNav{
    display:flex;
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:64px;
    z-index:7000;
    background:#15151b;
    border-top:1px solid #292930;
}
.bottomNav button{
    flex:1;
    border:0;
    background:transparent;
    color:white;
    cursor:pointer;
    font-size:12px;
}
.bottomNav button span{
    display:block;
    font-size:22px;
    margin-bottom:2px;
}
.bottomNav button.active{
    background:#202027;
    color:#6f8cff;
}
#app{padding-bottom:64px}
#friendsScreen{padding-bottom:86px}

@media(min-width:701px){
    .bottomNav{
        left:300px;
    }
}
@media(max-width:700px){
    #app{padding-bottom:64px}
    .bottomNav{
        height:62px;
    }
    .bottomNav button span{font-size:20px}
    .friendsPanel{
        min-height:calc(100vh - 30px);
        padding:15px;
        border-radius:16px;
    }
}

@media(max-width:700px){
    .sidebar{
        width:90px;
    }
    .sidebar .profileText,
    .sidebar .search,
    .sidebar .personText,
    .sidebar .logoutText{
        display:none;
    }
    .person{
        justify-content:center;
    }
    .bubble{max-width:85%}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen">
    <div class="loginBox">
        <h1>SHOCIAL CHAT</h1>
        <p>Chat with your friends</p>
        <button class="googleBtn" id="googleLogin">
            🔐 Continue with Google
        </button>
    </div>
</div>

<!-- APP -->
<div id="app">

    <aside class="sidebar">

        <div class="profile">
            <div class="profileRow">
                <img id="myAvatar" class="avatar">
                <div class="profileText">
                    <b id="myName">User</b>
                    <div id="myEmail" style="font-size:11px;opacity:.6"></div>
                </div>
            </div>
        </div>

        <input
            id="searchInput"
            class="search"
            placeholder="Search people..."
        >

        <div id="people" class="people"></div>

        <button class="logout" id="logoutBtn">
            🚪 <span class="logoutText">Logout</span>
        </button>

        <button class="settingsBtn" id="settingsBtn">
            ⚙️ <span class="logoutText">Profile & Theme</span>
        </button>

    </aside>

    <main class="chatArea">

        <div class="chatHeader">

            <div class="chatUser">
                <img id="chatAvatar" class="avatar">
                <div>
                    <b id="chatName">Select someone</b>
                    <div id="chatStatus" style="font-size:11px;opacity:.6"></div>
                </div>
            </div>

            <div class="callButtons">
                <button class="callBtn" id="voiceCallBtn">
                    📞
                </button>
            </div>

        </div>

        <div id="messages" class="messages"></div>

        <div class="composer">

            <input type="file" id="fileInput" hidden>

            <button class="mediaBtn" id="mediaBtn">📎</button>

            <button class="voiceBtn" id="voiceBtn">🎙️</button>

            <input
                id="messageInput"
                placeholder="Type a message..."
            >

            <button class="sendBtn" id="sendBtn">➤</button>

        </div>

    </main>

</div>


<!-- PROFILE SETTINGS -->
<div id="settingsModal">

    <div class="settingsBox">

        <h2>Profile & Theme</h2>

        <img id="settingsAvatar" class="settingsAvatar">

        <input
            type="file"
            id="profilePhotoInput"
            accept="image/*"
            hidden
        >

        <button class="settingsBtn" id="changePhotoBtn" style="width:100%;margin:0 0 10px;">
            📷 Change Profile Photo
        </button>

        <input
            id="nameInput"
            class="settingsInput"
            placeholder="Your name"
            maxlength="40"
        >

        <div style="margin-top:12px;font-weight:bold;">
            Choose Theme
        </div>

        <div class="themeRow">
            <button class="themeBtn" data-theme="dark">🌑 Dark</button>
            <button class="themeBtn" data-theme="blue">🔵 Blue</button>
            <button class="themeBtn" data-theme="purple">🟣 Purple</button>
            <button class="themeBtn" data-theme="green">🟢 Green</button>
        </div>

        <button class="saveSettings" id="saveSettingsBtn">
            💾 Save Changes
        </button>

        <button class="closeSettings" id="closeSettingsBtn">
            Close
        </button>

    </div>

</div>


<!-- FRIENDS -->
<div id="friendsScreen">
    <div class="friendsPanel">
        <div class="friendsTop">
            <h2>👥 Friends</h2>
            <button class="friendsClose" id="closeFriends">✕</button>
        </div>

        <div class="friendTabs">
            <button class="friendTab active" id="friendsTab">My Friends</button>
            <button class="friendTab" id="requestsTab">Requests <span id="requestCount"></span></button>
            <button class="friendTab" id="addPeopleTab">Add People</button>
        </div>

        <input id="friendSearch" class="friendSearch" placeholder="Search people...">

        <div id="friendList" class="friendList"></div>
    </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottomNav">
    <button id="chatNav" class="active">
        <span>💬</span>Chat
    </button>
    <button id="friendsNav">
        <span>👥</span>Friends
    </button>
</nav>

<!-- CALL UI -->
<div id="callScreen">

    <div class="callBox">

        <img id="callAvatar" class="callAvatar">

        <div id="callName" class="callName">
            Calling...
        </div>

        <div id="callStatus" class="callStatus">
            Calling...
        </div>

        <div id="callTimer" class="callStatus">
            00:00
        </div>

        <div class="callActions">

            <button
                id="acceptCall"
                class="accept"
            >📞</button>

            <button
                id="muteCall"
                class="mute"
                style="display:none"
            >🎙️</button>

            <button
                id="rejectCall"
                class="reject"
            >✕</button>

        </div>

    </div>

</div>

<audio id="remoteAudio" autoplay></audio>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    setDoc,
    getDoc,
    getDocs,
    addDoc,
    deleteDoc,
    onSnapshot,
    query,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyDejlZ2MNrf5C0L6UptLQN_TvShnTI84FE",
    authDomain: "social-chat-3326f.firebaseapp.com",
    projectId: "social-chat-3326f",
    storageBucket: "social-chat-3326f.firebasestorage.app",
    messagingSenderId: "1018414118260",
    appId: "1:1018414118260:web:2f28dcfd2beb2c62e9a821",
    measurementId: "G-CWCYBF3JCC"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


let currentUser = null;

let currentChatUser = null;

let unsubscribeMessages = null;

let unsubscribePeople = null;

let unsubscribeIncomingCalls = null;

let friendUids = new Set();
let friendData = [];
let friendsMode = "friends";


/* =========================
   LOGIN
========================= */

document
.getElementById("googleLogin")
.addEventListener("click", async () => {

    try{

        await signInWithPopup(auth, provider);

    }catch(error){

        alert(error.message);

    }

});


/* =========================
   AUTH
========================= */

onAuthStateChanged(auth, async user => {

    if(user){

        currentUser = user;

        document.getElementById("loginScreen").style.display = "none";

        document.getElementById("app").style.display = "flex";

        await createProfile();

        await loadMyProfile();

        loadPeople();

        listenIncomingCalls();

    }else{

        document.getElementById("loginScreen").style.display = "flex";

        document.getElementById("app").style.display = "none";

    }

});


/* =========================
   PROFILE
========================= */

async function createProfile(){

    const ref = doc(db,"users",currentUser.uid);

    const snap = await getDoc(ref);

    if(!snap.exists()){

        await setDoc(ref,{

            uid:currentUser.uid,

            name:currentUser.displayName || "User",

            email:currentUser.email || "",

            photo:currentUser.photoURL || "",

            createdAt:serverTimestamp()

        });

    }

}


async function loadMyProfile(){

    const snap = await getDoc(
        doc(db,"users",currentUser.uid)
    );

    if(!snap.exists()) return;

    const data = snap.data();

    document.getElementById("myName").textContent =
        data.name || "User";

    document.getElementById("myEmail").textContent =
        data.email || "";

    document.getElementById("myAvatar").src =
        data.photo ||
        currentUser.photoURL ||
        "https://ui-avatars.com/api/?name=User";

}


/* =========================
   PEOPLE
========================= */

async function loadPeople(){

    const peopleBox =
        document.getElementById("people");

    const friendsSnap =
        await getDocs(
            collection(
                db,
                "users",
                currentUser.uid,
                "friends"
            )
        );

    friendUids = new Set();

    friendsSnap.forEach(item => {
        friendUids.add(item.id);
    });

    const userPromises =
        [...friendUids].map(async uid => {

            const snap =
                await getDoc(doc(db,"users",uid));

            return snap.exists()
                ? snap.data()
                : null;

        });

    friendData =
        (await Promise.all(userPromises))
        .filter(Boolean);

    function render(){

        peopleBox.innerHTML = "";

        const search =
            document.getElementById("searchInput")
            .value
            .toLowerCase();

        const list =
            friendData.filter(data =>
                !search ||
                (data.name || "")
                .toLowerCase()
                .includes(search)
            );

        if(!list.length){

            peopleBox.innerHTML =
                `<div style="padding:20px;text-align:center;opacity:.5">
                    No friends yet.<br>Tap 👥 Friends below to add people.
                </div>`;

            return;

        }

        list.forEach(data => {

            const div = document.createElement("div");

            div.className = "person";

            div.innerHTML = `
                <img class="avatar"
                src="${data.photo ||
                "https://ui-avatars.com/api/?name="+
                encodeURIComponent(data.name || "User")}">

                <div class="personText">
                    <b>${escapeHTML(data.name || "User")}</b>
                    <div style="font-size:10px;opacity:.5">
                        ${escapeHTML(data.email || "")}
                    </div>
                </div>
            `;

            div.onclick = () => openChat(data);

            peopleBox.appendChild(div);

        });

    }

    render();

    document
    .getElementById("searchInput")
    .oninput = render;

}


/* =========================
   FRIEND SYSTEM
========================= */

const friendsScreen =
    document.getElementById("friendsScreen");

const friendList =
    document.getElementById("friendList");

const friendSearch =
    document.getElementById("friendSearch");

document.getElementById("friendsNav").onclick = () => {
    friendsScreen.style.display = "block";
    friendsMode = "friends";
    setFriendTab("friends");
    loadFriendPanel();
};

document.getElementById("chatNav").onclick = () => {
    friendsScreen.style.display = "none";
};

document.getElementById("closeFriends").onclick = () => {
    friendsScreen.style.display = "none";
};

document.getElementById("friendsTab").onclick = () => {
    friendsMode = "friends";
    setFriendTab("friends");
    loadFriendPanel();
};

document.getElementById("requestsTab").onclick = () => {
    friendsMode = "requests";
    setFriendTab("requests");
    loadFriendPanel();
};

document.getElementById("addPeopleTab").onclick = () => {
    friendsMode = "add";
    setFriendTab("add");
    loadFriendPanel();
};

friendSearch.oninput = () => loadFriendPanel();

function setFriendTab(tab){

    document
    .getElementById("friendsTab")
    .classList.toggle("active",tab === "friends");

    document
    .getElementById("requestsTab")
    .classList.toggle("active",tab === "requests");

    document
    .getElementById("addPeopleTab")
    .classList.toggle("active",tab === "add");

    friendSearch.style.display =
        tab === "requests" ? "none" : "block";
}

async function loadFriendPanel(){

    if(!currentUser) return;

    friendList.innerHTML =
        `<div class="emptyFriends">Loading...</div>`;

    if(friendsMode === "friends"){
        await loadFriendsList();
    }else if(friendsMode === "requests"){
        await loadFriendRequests();
    }else{
        await loadAddPeople();
    }
}

async function loadFriendsList(){

    const snap =
        await getDocs(
            collection(
                db,
                "users",
                currentUser.uid,
                "friends"
            )
        );

    const users = [];

    for(const item of snap.docs){

        const userSnap =
            await getDoc(
                doc(db,"users",item.id)
            );

        if(userSnap.exists())
            users.push(userSnap.data());

    }

    friendList.innerHTML = "";

    if(!users.length){

        friendList.innerHTML =
            `<div class="emptyFriends">
                Abhi koi friend nahi hai.<br>
                <b>Add People</b> se friend request bhejo.
            </div>`;

        return;
    }

    users.forEach(user => {

        const card = createFriendCard(user);

        const button =

async function loadFriendRequests(){

    const snap =
        await getDocs(
            collection(
                db,
                "users",
                currentUser.uid,
                "friendRequests"
            )
        );

    friendList.innerHTML = "";

    let count = 0;

    for(const item of snap.docs){

        const request = item.data();

        if(request.status !== "pending")
            continue;

        count++;

        const userSnap =
            await getDoc(
                doc(db,"users",request.from)
            );

        if(!userSnap.exists())
            continue;

        const user = userSnap.data();

        const card = createFriendCard(user);

        const accept =
            document.createElement("button");

        accept.className =
            "friendAction green";

        accept.textContent =
            "✓ Accept";

        accept.onclick = () =>
            acceptFriendRequest(item.id,request.from);

        const decline =
            document.createElement("button");

        decline.className =
            "friendAction gray";

        decline.textContent =
            "✕";

        decline.onclick = () =>
            declineFriendRequest(item.id);

        card.appendChild(accept);
        card.appendChild(decline);

        friendList.appendChild(card);

    }

    document
    .getElementById("requestCount")
    .textContent =

        friendList.innerHTML =
            `<div class="emptyFriends">
                No new friend requests.
            </div>`;

    }

async function loadAddPeople(){

    const snap =
        await getDocs(
            collection(db,"users")
        );

    const search =
        friendSearch.value
        .trim()
        .toLowerCase();

    friendList.innerHTML = "";

    let shown = 0;

    for(const item of snap.docs){

        const user = item.data();

        if(user.uid === currentUser.uid)
            continue;

        if(
            search &&
            !(user.name || "")
            .toLowerCase()
            .includes(search)
        )
            continue;

        shown++;

        const card = createFriendCard(user);

        const friendSnap =
            await getDoc(
                doc(
                    db,
                    "users",
                    currentUser.uid,
                    "friends",
                    user.uid
                )
            );

        if(friendSnap.exists()){

                document.createElement("button");

            button.className =
                "friendAction gray";

            button.textContent =

            button.disabled = true;

            card.appendChild(button);

        }else{

            const sentSnap =
                await getDoc(
                    doc(
                        db,
                        "users",
                        user.uid,
                        "friendRequests",
                        currentUser.uid
                    )
                );

                document.createElement("button");

function createFriendCard(user){

    const card =
        document.createElement("div");

        user.photo ||

        encodeURIComponent(user.name || "User");

            <b>${escapeHTML(user.name || "User")}</b>
            <div>${escapeHTML(user.email || "")}</div>

function chatId(a,b){

    return [a,b].sort().join("_");

}


/* =========================

function openChat(user){

    currentChatUser = user;

    document.getElementById("chatName")
        .textContent =

/* =========================
   LOAD MESSAGES
========================= */

function loadMessages(){

    if(!currentChatUser) return;

    if(unsubscribeMessages)
        unsubscribeMessages();

    const id =
        chatId(
            currentUser.uid,
            currentChatUser.uid
        );

    const ref =
        collection(
            db,
            "chats",
            id,
            "messages"
        );

    const q =
        query(
            ref,
            orderBy("createdAt","asc")
        );

    unsubscribeMessages =
        onSnapshot(q,snapshot => {

            const box =
                document.getElementById("messages");

            box.innerHTML = "";

            snapshot.forEach(item => {

                const msg = item.data();

                renderMessage(
                    item.id,
                    msg,
                    box
                );

            });

            box.scrollTop = box.scrollHeight;

        });

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(id,msg,box){

    const mine =
        msg.senderId === currentUser.uid;

    const div =
        document.createElement("div");

    div.className =
        "message " +
        (mine ? "mine" : "");

    let content = "";

    if(msg.type === "image"){

        content = `
            <img
                src="${msg.data}"
                style="
                    max-width:250px;
                    border-radius:12px;
                "
            >
        `;

    }else if(msg.type === "voice"){

        content = `
            <audio
                controls
                src="${msg.data}"
                style="max-width:220px"
            ></audio>
        `;

    }else if(msg.type === "file"){

        content = `
            <a
                href="${msg.data}"
                download="${escapeHTML(msg.name || "file")}"
                style="color:white"
            >
                📄 ${escapeHTML(msg.name || "File")}
            </a>
        `;

    }else{

        content =
            escapeHTML(msg.text || "");

    }

    div.innerHTML = `
        <div class="bubble">

            ${content}

            <div class="time">
                ${formatTime(msg.createdAt)}
            </div>

        </div>
    `;

    box.appendChild(div);

}

let mediaRecorder = null;

document
.getElementById("voiceBtn")
.onclick = async () => {

    if(mediaRecorder &&
       mediaRecorder.state === "recording"){

        mediaRecorder.stop();

        return;

    }

    if(!currentChatUser){

        alert("Pehle kisi person ko select karo.");

        return;

    }

    try{

        const stream =
            await navigator.mediaDevices
            .getUserMedia({audio:true});

        audioChunks = [];

        mediaRecorder =
            new MediaRecorder(stream);

        mediaRecorder.ondataavailable =
            e => audioChunks.push(e.data);

        mediaRecorder.onstop = async () => {

            stream.getTracks()
                .forEach(track=>track.stop());

            const blob =
                new Blob(
                    audioChunks,
                    {type:"audio/webm"}
                );

            if(blob.size > 700000){

                alert("Voice message too large.");

                return;

            }

            const reader =
                new FileReader();

            reader.onload = async () => {

                const id =
                    chatId(
                        currentUser.uid,

                await addDoc(
                    collection(
                        db,
                        "chats",
                        id,
                        "messages"
                    ),
                    {
                        type:"voice",
                        data:reader.result,
                        senderId:currentUser.uid,
                        receiverId:currentChatUser.uid,
                        createdAt:serverTimestamp()
                    }
                );

            };

            reader.readAsDataURL(blob);

        };

/* FREE STUN SERVERS */

const rtcConfig = {

/* =========================
   START CALL
========================= */

document
.getElementById("voiceCallBtn")
.onclick = startVoiceCall;


async function startVoiceCall(){

    if(!currentChatUser){

        alert("Pehle kisi person ko select karo.");

        return;

    }

    try{

        localStream =
            await navigator.mediaDevices
            .getUserMedia({
                audio:true,
                video:false
            });

    }catch(error){

        alert(
            "Microphone permission allow karo."
        );

        return;

    }

    currentCallId =
        currentUser.uid +
        "_" +
        Date.now();

    callDocRef =
        doc(
            db,
            "calls",
            currentCallId
        );

    peerConnection =
        new RTCPeerConnection(rtcConfig);

    localStream
        .getTracks()
        .forEach(track =>
            peerConnection.addTrack(
                track,
                localStream
            )
        );

    peerConnection.ontrack =
        event => {

            const audio =
                document.getElementById(
                    "remoteAudio"
                );

            audio.srcObject =
                event.streams[0];

        };


    peerConnection.onicecandidate =
        async event => {

            if(event.candidate){

                await addDoc(
                    collection(
                        db,
                        "calls",
                        currentCallId,
                        "callerCandidates"
                    ),
                    event.candidate.toJSON()
                );

            }

        };


    const offer =
        await peerConnection.createOffer();

    await peerConnection.setLocalDescription(
        offer
    );


    await setDoc(
        callDocRef,
        {
            callerId:currentUser.uid,

            calleeId:currentChatUser.uid,

            callerName:
                currentUser.displayName ||
                "User",

            callerPhoto:
                currentUser.photoURL || "",

            offer:{
                type:offer.type,
                sdp:offer.sdp
            },

            status:"ringing",

            createdAt:serverTimestamp()
        }
    );


    showCallScreen(
        currentChatUser.name || "User",
        currentChatUser.photo || "",
        "Calling..."
    );


    listenForAnswer();

    listenForCalleeCandidates();

}


/* =========================
   LISTEN ANSWER
========================= */

function listenForAnswer(){

    if(unsubscribeCall)
        unsubscribeCall();

    unsubscribeCall =
        onSnapshot(
            callDocRef,
            async snap => {

                if(!snap.exists())
                    return;

                const data = snap.data();

                if(
                    data.answer &&
                    !peerConnection.currentRemoteDescription
                ){

                    await peerConnection.setRemoteDescription(
                        new RTCSessionDescription(
                            data.answer
                        )
                    );

                    startTimer();

                    document
                    .getElementById("callStatus")
                    .textContent =
                        "Connected";

                    document
                    .getElementById("muteCall")
                    .style.display =
                        "block";

                }

                if(data.status === "ended"){

                    endCall(false);

                }

            }
        );

}


/* =========================
   CALLEE CANDIDATES
========================= */

function listenForCalleeCandidates(){

    onSnapshot(
        collection(
            db,
            "calls",
            currentCallId,
            "calleeCandidates"
        ),
        snapshot => {

            snapshot.docChanges()
            .forEach(async change => {

                if(change.type === "added"){

                    await peerConnection
                    .addIceCandidate(
                        new RTCIceCandidate(
                            change.doc.data()
                        )
                    );

                }

            });

        }
    );

}

        unsubscribeIncomingCalls();

    const q =
        query(
            collection(db,"calls")
        );

    unsubscribeIncomingCalls =
        onSnapshot(q,snapshot => {

            snapshot.docChanges()
            .forEach(change => {

                if(change.type !== "added")
                    return;

                const data =
                    change.doc.data();

                if(
                    data.calleeId !==
                    currentUser.uid
                ) return;

                if(data.status !== "ringing")
                    return;

                if(currentCallId)
                    return;

                showIncomingCall(
                    change.doc.id,
                    data
                );

            });

        });

}

async function acceptCall(){

    try{

        const snap =

        localStream =
            await navigator.mediaDevices

                    );

}

/* =========================
   END CALL
========================= */

async function endCall(updateRemote=true){

    try{

        if(
            updateRemote &&
            callDocRef
        ){

            await setDoc(
                callDocRef,
                {
                    status:"ended"
                },
                {merge:true}
            );

        }

    }catch(e){

        console.log(e);

    }


    if(unsubscribeCall){

        unsubscribeCall();

        unsubscribeCall = null;

    }


    if(peerConnection){

        peerConnection.close();

        peerConnection = null;

    }


    if(localStream){

        localStream
        .getTracks()
        .forEach(track =>
            track.stop()
        );

        localStream = null;

    }


    document
    .getElementById("remoteAudio")
    .srcObject = null;


    stopTimer();

    currentCallId = null;

    callDocRef = null;

    document
    .getElementById("callScreen")
    .style.display =
        "none";

}

/* =========================
   TIMER
========================= */

function startTimer(){

    if(callTimerInterval)
        return;

    callSeconds = 0;

    callTimerInterval =
        setInterval(() => {

            callSeconds++;

            const mins =
                String(
                    Math.floor(
                        callSeconds / 60
                    )
                ).padStart(2,"0");

            const secs =
                String(
                    callSeconds % 60
                ).padStart(2,"0");

            document
            .getElementById("callTimer")
            .textContent =
                mins + ":" + secs;

        },1000);

}


function stopTimer(){

    if(callTimerInterval){

        clearInterval(callTimerInterval);

        callTimerInterval = null;

    }

    document
    .getElementById("callTimer")
    .textContent =
        "00:00";

}

    );

    if(theme !== "dark"){
        document.body.classList.add(
            "theme-" + theme
        );
    }

    selectedTheme = theme;

    localStorage.setItem(
        "shocialTheme",
        theme
    );

    document
    .querySelectorAll(".themeBtn")
    .forEach(btn => {

        btn.classList.toggle(
            "active",
            btn.dataset.theme === theme
        );

    });

}

applyTheme(selectedTheme);

document
.getElementById("settingsBtn")
.onclick = async () => {

    if(!currentUser) return;

    const snap =
        await getDoc(
            doc(db,"users",currentUser.uid)
        );

    const data =
        snap.exists()
        ? snap.data()
        : {};

    nameInput.value =
        data.name ||
        currentUser.displayName ||
        "";

    settingsAvatar.src =
        data.photo ||
        currentUser.photoURL ||
        "https://ui-avatars.com/api/?name=User";

    applyTheme(
        localStorage.getItem("shocialTheme") || "dark"
    );

    settingsModal.style.display = "flex";

};

document
.getElementById("closeSettingsBtn")
.onclick = () => {

    settingsModal.style.display = "none";

};

settingsModal.onclick = e => {

    if(e.target === settingsModal)
        settingsModal.style.display = "none";

};

document
.querySelectorAll(".themeBtn")
.forEach(btn => {

    btn.onclick = () => {

        applyTheme(btn.dataset.theme);

    };

});


document
.getElementById("changePhotoBtn")
.onclick = () => {

    document
    .getElementById("profilePhotoInput")
    .click();

};


document
.getElementById("profilePhotoInput")
.onchange = e => {

    const file = e.target.files[0];

    if(!file) return;

    if(!file.type.startsWith("image/")){

        alert("Sirf image select karo.");

        return;

    }

    if(file.size > 500000){

        alert("Photo 500KB se choti rakho.");

        return;

    }

    const reader = new FileReader();

    reader.onload = () => {

        settingsAvatar.src =
            reader.result;

    };

    reader.readAsDataURL(file);

};


document
.getElementById("saveSettingsBtn")
.onclick = async () => {

    if(!currentUser) return;

    const name =
        nameInput.value.trim();

    if(!name){

        alert("Name enter karo.");

        return;

    }

    try{

        const photo =
            settingsAvatar.src;

        await setDoc(
            doc(db,"users",currentUser.uid),
            {
                name:name,
                photo:photo
            },
            {merge:true}
        );

        document
        .getElementById("myName")
        .textContent = name;

        document
        .getElementById("myAvatar")
        .src = photo;

        settingsModal.style.display = "none";

        loadPeople();

        if(currentChatUser){

            currentChatUser.name = name;

        }

        alert("Profile updated successfully.");

    }catch(error){

        alert(
            "Profile update nahi hui: " +
            error.message
        );

    }

};

/* =========================
   LOGOUT
========================= */

document
.getElementById("logoutBtn")
.onclick = async () => {

    await signOut(auth);

};


/* =========================
   HELPERS
========================= */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function formatTime(timestamp){

    if(!timestamp)
        return "";

    try{

        return timestamp
            .toDate()
            .toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }catch{

        return "";

    }

}
