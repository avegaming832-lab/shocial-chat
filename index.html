<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOCIAL CHAT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f4f6;color:#111827;height:100vh;overflow:hidden}
button,input{font:inherit}
button{cursor:pointer}

#loginScreen{
height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#111827,#4f46e5,#9333ea)
}
.loginBox{
background:white;width:380px;max-width:92%;padding:35px;
border-radius:25px;text-align:center;box-shadow:0 20px 60px #0005
}
.logo{font-size:38px;font-weight:900;margin-bottom:10px}
.loginBox p{color:#666;margin-bottom:25px}
.googleBtn{
width:100%;padding:14px;border:0;border-radius:12px;
background:#111827;color:white;font-weight:bold
}

#app{display:none;height:100vh;flex-direction:row}

.sidebar{
width:330px;background:white;border-right:1px solid #ddd;
display:flex;flex-direction:column
}
.top{padding:18px;border-bottom:1px solid #eee}
.brand{font-size:25px;font-weight:900;margin-bottom:15px}

.profile{
display:flex;align-items:center;gap:12px;padding:10px;
border-radius:15px;background:#f5f5f7
}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#ddd}
.profileInfo{flex:1;min-width:0}
.profileName{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profileUser{font-size:13px;color:#777}
.smallBtn,.headerBtn{
border:0;background:#e5e7eb;padding:8px 10px;border-radius:9px
}
.search{margin-top:15px}
.search input{
width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;outline:none
}
.sectionTitle{padding:15px 18px 8px;font-size:13px;color:#777;font-weight:bold}
.people{overflow:auto;flex:1}

.person{
display:flex;align-items:center;gap:10px;padding:12px 18px;
border-bottom:1px solid #f1f1f1
}
.person:hover{background:#f7f7f8}
.personInfo{flex:1;min-width:0}
.personName{font-weight:bold}
.personStatus{font-size:12px;color:#777}
.onlineDot,.offlineDot{
width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px
}
.onlineDot{background:#22c55e}
.offlineDot{background:#aaa}
.actionBtn{
border:0;padding:7px 10px;border-radius:9px;background:#4f46e5;color:white;font-size:12px
}
.logout{
margin:12px 18px 18px;padding:12px;border:0;border-radius:12px;
background:#ef4444;color:white;font-weight:bold
}

.chatArea{flex:1;display:flex;flex-direction:column;min-width:0}
.chatHeader{
height:75px;padding:12px 20px;background:white;border-bottom:1px solid #ddd;
display:flex;align-items:center;gap:12px
}
.chatHeaderInfo{flex:1}
.chatName{font-weight:bold;font-size:18px}
.chatStatus{font-size:13px;color:#777}

.messages{
flex:1;overflow:auto;padding:20px;background:#f1f4f9
}
.empty{
height:100%;display:flex;justify-content:center;align-items:center;
text-align:center;color:#888
}

.message{display:flex;margin-bottom:12px}
.message.mine{justify-content:flex-end}
.bubble{
max-width:75%;padding:10px 13px;border-radius:17px;background:white;
box-shadow:0 2px 7px #0000000d
}
.mine .bubble{
background:#4f46e5;color:white;border-bottom-right-radius:4px
}
.message:not(.mine) .bubble{border-bottom-left-radius:4px}
.messageText{word-break:break-word;white-space:pre-wrap}

.messageImage{
display:block;width:240px;max-width:100%;max-height:300px;
object-fit:cover;border-radius:12px;margin-bottom:5px
}
.voicePlayer{width:240px;max-width:100%;margin:4px 0}
.fileBox{
padding:10px;background:#0001;border-radius:10px;margin-bottom:5px;
word-break:break-word
}

.messageMeta{
font-size:10px;opacity:.7;margin-top:5px;
display:flex;gap:6px;align-items:center
}
.reactions{margin-top:5px;display:flex;gap:4px}
.react{
border:0;background:#eee;border-radius:10px;padding:3px 7px;font-size:12px
}
.mine .react{background:#ffffff44;color:white}
.deleteBtn{border:0;background:transparent;font-size:11px;opacity:.7}

.typing{height:22px;padding-left:20px;font-size:12px;color:#777}

.composer{
background:white;padding:12px;border-top:1px solid #ddd;
display:flex;gap:7px;align-items:center
}
.composer input{
flex:1;padding:13px;border:1px solid #ddd;border-radius:14px;outline:none
}
.mediaBtn,.voiceBtn,.sendBtn{
width:45px;height:45px;border:0;border-radius:13px;
background:#eee;font-size:19px
}
.sendBtn{background:#4f46e5;color:white}

.recording{
background:#ef4444!important;color:white!important;
animation:pulse 1s infinite
}
@keyframes pulse{50%{opacity:.5}}

.modal{
position:fixed;inset:0;background:#0008;display:none;
justify-content:center;align-items:center;z-index:100
}
.modalBox{
width:400px;max-width:92%;background:white;border-radius:20px;padding:25px
}
.modalBox h2{margin-bottom:20px}
.modalBox label{display:block;font-size:13px;margin:12px 0 6px;color:#666}
.modalBox input{
width:100%;padding:12px;border:1px solid #ddd;border-radius:10px
}
.modalButtons{display:flex;gap:10px;margin-top:20px}
.modalButtons button{
flex:1;padding:12px;border:0;border-radius:10px
}
.saveBtn{background:#4f46e5;color:white}
.cancelBtn{background:#eee}

#toast{
position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
background:#111827;color:white;padding:12px 18px;border-radius:12px;
display:none;z-index:200
}

.backBtn{display:none}

@media(max-width:700px){
.sidebar{width:100%}
.chatArea{display:none}
.sidebar.chat-open{display:none}
.sidebar.chat-open + .chatArea{display:flex;width:100%}
.backBtn{display:block!important}
.bubble{max-width:88%}
}

body.dark{background:#111827;color:#eee}
body.dark .sidebar,
body.dark .chatHeader,
body.dark .composer,
body.dark .modalBox,
body.dark .loginBox{background:#1f2937;color:#eee}
body.dark .profile,
body.dark .smallBtn,
body.dark .headerBtn{background:#374151;color:white}
body.dark .search input,
body.dark .composer input,
body.dark .modalBox input{
background:#111827;color:white;border-color:#4b5563
}
body.dark .messages{background:#111827}
body.dark .person:hover{background:#374151}
body.dark .person{border-color:#374151}
body.dark .bubble{background:#374151;color:white}
</style>
</head>

<body>

<div id="loginScreen">
<div class="loginBox">
<div class="logo">💬 SHOCIAL</div>
<p>Chat. Connect. Socialize.</p>
<button class="googleBtn" id="googleLogin">
🔵 Continue with Google
</button>
</div>
</div>

<div id="app">

<aside class="sidebar" id="sidebar">

<div class="top">
<div class="brand">💬 SHOCIAL</div>

<div class="profile">
<img id="myAvatar" class="avatar">
<div class="profileInfo">
<div id="myName" class="profileName">User</div>
<div id="myUsername" class="profileUser">@user</div>

<button class="smallBtn" id="editProfile">⚙️</button>
</div>

<div class="search">
<input id="searchInput" placeholder="Search people...">

<div class="sectionTitle">PEOPLE</div>
<div class="people" id="people"></div>

<button class="logout" id="logout">Logout</button>

</aside>

<main class="chatArea">

<div class="chatHeader">
<button class="headerBtn backBtn" id="backBtn">←</button>

<img id="chatAvatar" class="avatar">

<div class="chatHeaderInfo">
<div id="chatName" class="chatName">Select someone</div>
<div id="chatStatus" class="chatStatus">Start a conversation</div>
</div>

<button class="headerBtn" id="themeBtn">🌙</button>
</div>

<div class="messages" id="messages">
<div class="empty">
<div>
<h2>💬 SHOCIAL CHAT</h2>
<p>Select a person to start chatting.</p>
</div>
</div>
</div>

<div class="typing" id="typing"></div>

<div class="composer">

<input type="file"
       id="fileInput"
       accept="image/*,.pdf,.txt,.doc,.docx"
       hidden>

<button class="mediaBtn" id="mediaBtn">📎</button>

<button class="voiceBtn" id="voiceBtn">🎙️</button>

<input id="messageInput"
       placeholder="Type a message..."
       disabled>

<button class="sendBtn"
        id="sendBtn"
        disabled>➤</button>

</div>

</main>
</div>

<div class="modal" id="profileModal">
<div class="modalBox">

<h2>✏️ Edit Profile</h2>

<label>Display Name</label>
<input id="editName">

<label>Username</label>
<input id="editUsername">

<label>Profile Photo URL</label>
<input id="editAvatar">

<div class="modalButtons">
<button class="cancelBtn" id="cancelEdit">Cancel</button>
<button class="saveBtn" id="saveProfile">Save</button>
</div>

</div>
</div>

<div id="toast"></div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
getFirestore,
collection,
doc,
setDoc,
getDoc,
getDocs,
addDoc,
updateDoc,
deleteDoc,
query,
orderBy,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

import {
getDatabase,
ref,
set,
onValue,
onDisconnect,
serverTimestamp as rtdbTimestamp
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";


const firebaseConfig={
apiKey:"AIzaSyBTjA_RsNNq1PtfSdE2VyFJS_5oU8BsVNc",
authDomain:"social-chat-d48ff.firebaseapp.com",
projectId:"social-chat-d48ff",
storageBucket:"social-chat-d48ff.firebasestorage.app",
messagingSenderId:"198437830373",
appId:"1:198437830373:web:61616f534f9ee7e3c19e0c",
measurementId:"G-7XMGG8N96Z"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const rtdb=getDatabase(app);
const provider=new GoogleAuthProvider();

let currentUser=null;
let currentProfile=null;
let selectedUser=null;
let unsubscribeMessages=null;
let unsubscribeTyping=null;
let peopleCache=[];
let mediaRecorder=null;
let audioChunks=[];
let recording=false;
let recordTimer=null;


const $=id=>document.getElementById(id);


function toast(t){
$("toast").textContent=t;
$("toast").style.display="block";
setTimeout(()=>$("toast").style.display="none",2500);
}


function avatarUrl(u){
return u.avatar ||
`https://ui-avatars.com/api/?name=${encodeURIComponent(u.displayName||"User")}&background=4f46e5&color=fff`;
}


function chatId(a,b){
return [a,b].sort().join("_");
}


function escapeHtml(t){
const d=document.createElement("div");
d.textContent=t||"";
return d.innerHTML;
}


/* PROFILE */

async function createProfile(user){

const r=doc(db,"users",user.uid);
const s=await getDoc(r);

if(!s.exists()){

const username=
(user.displayName||"user")
.toLowerCase()
.replace(/[^a-z0-9]/g,"")
.slice(0,15)+Math.floor(Math.random()*999);

await setDoc(r,{
uid:user.uid,
displayName:user.displayName||"User",
username,
email:user.email||"",
avatar:user.photoURL||"",
createdAt:serverTimestamp()
});

}
}


async function loadMyProfile(){

const s=await getDoc(doc(db,"users",currentUser.uid));

currentProfile=s.exists()?s.data():{
uid:currentUser.uid,
displayName:currentUser.displayName||"User",
username:"user",
avatar:currentUser.photoURL||""
};

renderMyProfile();
}


function renderMyProfile(){

$("myName").textContent=currentProfile.displayName||"User";
$("myUsername").textContent="@"+(currentProfile.username||"user");
$("myAvatar").src=avatarUrl(currentProfile);

}


/* ONLINE */

async function setOnline(){

const r=ref(rtdb,"status/"+currentUser.uid);

await set(r,{
state:"online",
lastChanged:rtdbTimestamp()
});

onDisconnect(r).set({
state:"offline",
lastChanged:rtdbTimestamp()
});
}


/* PEOPLE */

async function loadPeople(search=""){

const snap=await getDocs(collection(db,"users"));

peopleCache=[];

snap.forEach(d=>{
if(d.id!==currentUser.uid)peopleCache.push(d.data());
});

renderPeople(search);
}


function renderPeople(search=""){

$("people").innerHTML="";

const s=search.toLowerCase();

const list=peopleCache.filter(u=>
(u.displayName||"").toLowerCase().includes(s)||
(u.username||"").toLowerCase().includes(s)||
(u.email||"").toLowerCase().includes(s)
);

if(!list.length){
$("people").innerHTML="<div style='padding:20px;color:#888'>No people found.</div>";
return;
}

list.forEach(user=>{

const row=document.createElement("div");
row.className="person";

row.innerHTML=`
<img class="avatar" src="${avatarUrl(user)}">

<div class="personInfo">
<div class="personName">${escapeHtml(user.displayName||"User")}</div>
<div class="personStatus" id="p-${user.uid}">Checking...</div>
</div>

<button class="actionBtn">Chat</button>
`;

row.querySelector("button").onclick=()=>openChat(user);

listenStatus(user.uid,row.querySelector(".personStatus"));

$("people").appendChild(row);

});
}


function listenStatus(uid,el){

onValue(ref(rtdb,"status/"+uid),s=>{

const d=s.val();

if(d?.state==="online")
el.innerHTML="<span class='onlineDot'></span>Online";
else
el.innerHTML="<span class='offlineDot'></span>Offline";

});
}


/* CHAT */

async function openChat(user){

selectedUser=user;

$("chatName").textContent=user.displayName||"User";
$("chatAvatar").src=avatarUrl(user);

$("messageInput").disabled=false;
$("sendBtn").disabled=false;

$("sidebar").classList.add("chat-open");

loadMessages();
listenTyping();
listenChatStatus(user.uid);

}


function listenChatStatus(uid){

onValue(ref(rtdb,"status/"+uid),s=>{

const d=s.val();

if(d?.state==="online"){
$("chatStatus").innerHTML="<span class='onlineDot'></span>Online";
}else{
$("chatStatus").textContent="Offline";
}

});
}


function loadMessages(){

if(unsubscribeMessages)unsubscribeMessages();

const id=chatId(currentUser.uid,selectedUser.uid);

const q=query(
collection(db,"chats",id,"messages"),
orderBy("createdAt","asc")
);

unsubscribeMessages=onSnapshot(q,snap=>{

$("messages").innerHTML="";

if(snap.empty){

$("messages").innerHTML=`
<div class="empty">
<div>
<h2>👋 Say Hello!</h2>
<p>No messages yet.</p>
</div>
</div>`;

return;
}

snap.forEach(s=>renderMessage(s.id,s.data()));

$("messages").scrollTop=$("messages").scrollHeight;

});
}


/* MESSAGE RENDER */

function renderMessage(id,msg){

const mine=msg.senderId===currentUser.uid;

const wrap=document.createElement("div");
wrap.className="message "+(mine?"mine":"");

let content="";

if(msg.type==="image"){

content=`
<img class="messageImage"
src="${msg.data}"
alt="image">
`;

}else if(msg.type==="voice"){

content=`
<audio class="voicePlayer"
controls
src="${msg.data}">
</audio>
`;

}else if(msg.type==="file"){

content=`
<div class="fileBox">
📎 ${escapeHtml(msg.fileName||"File")}
<br>
<a href="${msg.data}"
download="${escapeHtml(msg.fileName||"file")}"
style="color:inherit">Open file</a>
</div>
`;

}else{

content=`
<div class="messageText">
${escapeHtml(msg.text||"")}
</div>
`;
}


let time="";

if(msg.createdAt?.toDate)
time=msg.createdAt.toDate().toLocaleTimeString([],{
hour:"2-digit",
minute:"2-digit"
});


wrap.innerHTML=`
<div class="bubble">

${content}

<div class="messageMeta">

<span>${time}</span>

${mine?`<span>${msg.seen?"✓✓ Seen":"✓ Delivered"}</span>`:""}

${mine?
`<button class="deleteBtn"
onclick="deleteMessage('${id}')">Delete</button>`:""}

</div>

<div class="reactions">

<button class="react"
onclick="reactMessage('${id}','❤️')">❤️</button>

<button class="react"
onclick="reactMessage('${id}','👍')">👍</button>

<button class="react"
onclick="reactMessage('${id}','😂')">😂</button>

${msg.reaction?`<span>${msg.reaction}</span>`:""}

</div>

</div>
`;

$("messages").appendChild(wrap);

if(!mine&&!msg.seen)markSeen(id);

}


async function markSeen(id){

if(!selectedUser)return;

const c=chatId(currentUser.uid,selectedUser.uid);

try{
await updateDoc(
doc(db,"chats",c,"messages",id),
{seen:true}
);
}catch(e){}

}


window.deleteMessage=async function(id){

const c=chatId(currentUser.uid,selectedUser.uid);

try{
await deleteDoc(doc(db,"chats",c,"messages",id));
toast("Deleted ✅");
}catch(e){
toast("Delete failed");
}

};


window.reactMessage=async function(id,r){

const c=chatId(currentUser.uid,selectedUser.uid);

try{
await updateDoc(
doc(db,"chats",c,"messages",id),
{reaction:r}
);
}catch(e){}

};


/* TEXT */

async function sendMessage(){

const input=$("messageInput");
const text=input.value.trim();

if(!text||!selectedUser)return;

const c=chatId(currentUser.uid,selectedUser.uid);

await addDoc(
collection(db,"chats",c,"messages"),
{
type:"text",
text,
senderId:currentUser.uid,
receiverId:selectedUser.uid,
createdAt:serverTimestamp(),
seen:false
}
);

input.value="";
stopTyping();
}


/* IMAGE COMPRESSION */

function compressImage(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const max=900;

let w=img.width;
let h=img.height;

if(w>max||h>max){

if(w>h){
h=h*(max/w);
w=max;
}else{
w=w*(max/h);
h=max;
}

}

const canvas=document.createElement("canvas");

canvas.width=w;
canvas.height=h;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,w,h);

resolve(
canvas.toDataURL("image/jpeg",0.65)
);

};

img.onerror=reject;
img.src=e.target.result;

};

reader.onerror=reject;
reader.readAsDataURL(file);

});
}


/* IMAGE / FILE */

$("mediaBtn").onclick=()=>{
$("fileInput").click();
};


$("fileInput").onchange=async e=>{

const file=e.target.files[0];

if(!file||!selectedUser)return;

try{

if(file.type.startsWith("image/")){

toast("Compressing image...");

const data=await compressImage(file);

if(data.length>850000){

toast("Image too large. Choose a smaller picture.");
return;
}

await sendMedia("image",data,file.name);

}else{

if(file.size>500000){

toast("Free mode: file must be under 500KB.");
return;
}

const reader=new FileReader();

reader.onload=async()=>{
await sendMedia("file",reader.result,file.name);
};

reader.readAsDataURL(file);

}

}catch(err){

console.error(err);
toast("Could not send file");

}

e.target.value="";
};


async function sendMedia(type,data,fileName){

const c=chatId(currentUser.uid,selectedUser.uid);

await addDoc(
collection(db,"chats",c,"messages"),
{
type,
data,
fileName:fileName||"",
senderId:currentUser.uid,
receiverId:selectedUser.uid,
createdAt:serverTimestamp(),
seen:false
}
);

toast(type==="image"?"Picture sent 📸":"File sent 📎");
}


/* VOICE */

$("voiceBtn").onclick=async()=>{

if(recording){

stopRecording();

}else{

startRecording();

}

};


async function startRecording(){

if(!selectedUser){
toast("Pehle chat select karo");
return;
}

if(!navigator.mediaDevices?.getUserMedia){
toast("Browser voice recording support nahi karta");
return;
}

try{

const stream=
await navigator.mediaDevices.getUserMedia({audio:true});

audioChunks=[];

mediaRecorder=
new MediaRecorder(stream);

recording=true;

$("voiceBtn").classList.add("recording");
$("voiceBtn").textContent="⏹️";

toast("Recording... dubara press karke stop karo");

mediaRecorder.ondataavailable=e=>{
if(e.data.size>0)audioChunks.push(e.data);
};

mediaRecorder.onstop=async()=>{

stream.getTracks().forEach(t=>t.stop());

const blob=new Blob(
audioChunks,
{type:"audio/webm"}
);

if(blob.size>700000){

toast("Voice too large. Keep it short.");
return;
}

const reader=new FileReader();

reader.onload=async()=>{

const data=reader.result;

if(data.length>850000){

toast("Voice too large. Keep it shorter.");
return;
}

await sendMedia("voice",data,"voice-message.webm");

};

reader.readAsDataURL(blob);

};

mediaRecorder.start();

}catch(e){

console.error(e);
toast("Microphone permission allow karo");

}

}


function stopRecording(){

if(mediaRecorder&&recording){

mediaRecorder.stop();

}

recording=false;

$("voiceBtn").classList.remove("recording");
$("voiceBtn").textContent="🎙️";

}


/* TYPING */

function listenTyping(){

if(unsubscribeTyping)unsubscribeTyping();

const c=chatId(currentUser.uid,selectedUser.uid);

unsubscribeTyping=
onValue(
ref(rtdb,"typing/"+c+"/"+selectedUser.uid),
s=>{

$("typing").textContent=
s.val()
?selectedUser.displayName+" is typing..."
:"";

}
);

}


let typingTimer;

async function startTyping(){

if(!selectedUser)return;

const c=chatId(currentUser.uid,selectedUser.uid);

await set(
ref(rtdb,"typing/"+c+"/"+currentUser.uid),
true
);

clearTimeout(typingTimer);

typingTimer=setTimeout(stopTyping,1000);

}


async function stopTyping(){

if(!selectedUser)return;

const c=chatId(currentUser.uid,selectedUser.uid);

await set(
ref(rtdb,"typing/"+c+"/"+currentUser.uid),
false
);

}


/* AUTH */

$("googleLogin").onclick=async()=>{

try{
await signInWithPopup(auth,provider);
}catch(e){
console.error(e);
toast(e.message);
}

};


onAuthStateChanged(auth,async user=>{

if(user){

currentUser=user;

await createProfile(user);
await loadMyProfile();
await setOnline();
await loadPeople();

$("loginScreen").style.display="none";
$("app").style.display="flex";

}else{

$("loginScreen").style.display="flex";
$("app").style.display="none";

}

});


/* SEARCH */

$("searchInput").oninput=e=>{
renderPeople(e.target.value);
};


/* BUTTONS */

$("sendBtn").onclick=sendMessage;

$("messageInput").onkeydown=e=>{

if(e.key==="Enter"){
e.preventDefault();
sendMessage();
}

};

$("messageInput").oninput=startTyping;


$("logout").onclick=async()=>{

if(currentUser){

await set(
ref(rtdb,"status/"+currentUser.uid),
{
state:"offline",
lastChanged:rtdbTimestamp()
}
);

}

await signOut(auth);

};


/* PROFILE EDIT */

$("editProfile").onclick=()=>{

$("editName").value=currentProfile.displayName||"";
$("editUsername").value=currentProfile.username||"";
$("editAvatar").value=currentProfile.avatar||"";

$("profileModal").style.display="flex";

};


$("cancelEdit").onclick=()=>{
$("profileModal").style.display="none";
};


$("saveProfile").onclick=async()=>{

const name=$("editName").value.trim();

const username=$("editUsername").value
.trim()
.replace(/^@/,"")
.replace(/[^a-zA-Z0-9_]/g,"");

const avatar=$("editAvatar").value.trim();

if(!name||!username){
toast("Name aur username required");
return;
}

await updateDoc(
doc(db,"users",currentUser.uid),
{
displayName:name,
username,
avatar
}
);

currentProfile.displayName=name;
currentProfile.username=username;
currentProfile.avatar=avatar;

renderMyProfile();
$("profileModal").style.display="none";

await loadPeople($("searchInput").value);

toast("Profile updated ✅");

};


/* THEME */

$("themeBtn").onclick=()=>{

document.body.classList.toggle("dark");

const dark=document.body.classList.contains("dark");

localStorage.setItem("dark",dark?"1":"0");

$("themeBtn").textContent=dark?"☀️":"🌙";

};

if(localStorage.getItem("dark")==="1"){

document.body.classList.add("dark");
$("themeBtn").textContent="☀️";

}


/* MOBILE BACK */

$("backBtn").onclick=()=>{
$("sidebar").classList.remove("chat-open");
};

</script>

</body>
</html>
